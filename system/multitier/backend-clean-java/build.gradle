// Clean-architecture variant of system/multitier/backend-java. Same HTTP contract, same DB schema,
// same component-test suite — only the inside differs. Not deployed and not system-tested: no
// VERSION, no Dockerfile, no SonarCloud project, no release tags. See README.md.
plugins {
	id 'java'
	id 'checkstyle'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

checkstyle {
	toolVersion = '10.21.4'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

// Override Spring Boot's managed Testcontainers version: 1.21.3 fails to talk to Docker Engine
// 29.x (docker-java returns HTTP 400 on the daemon handshake); 1.21.4 fixes it.
ext['testcontainers.version'] = '1.21.4'

group = 'com.mycompany.myshop.backend'
version = '0.0.1-SNAPSHOT'
description = 'MyShop - Backend (Clean Architecture)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Opt-in test layers, kept off the default `test`/`build` so the template's build stays fast and Docker-light.
//
// All four layers are now carried over from backend-java. The contract and integration layers were
// initially absent because their subject is an adapter (gateway, repository, controller) and
// adapters are exactly what this variant rewrites — so they were written per-variant once the
// clean-architecture design had settled, against the adapters that design produced:
// `infrastructure/external/**` for contract, `infrastructure/persistence/adapters/**` for
// narrow integration.
sourceSets {
	// Shared stub drivers/DSLs (support/), consumed by every opt-in test layer. Its own source set
	// so contract/integration tests depend only on the helpers, not on the whole componentTest suite.
	testSupport {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	componentTest {
		compileClasspath += sourceSets.main.output + sourceSets.testSupport.output
		runtimeClasspath += sourceSets.main.output + sourceSets.testSupport.output
	}
	contractTest {
		// componentTest.output because the Pact verifier reuses BaseComponentTest's harness.
		compileClasspath += sourceSets.componentTest.output + sourceSets.testSupport.output + sourceSets.main.output
		runtimeClasspath += sourceSets.componentTest.output + sourceSets.testSupport.output + sourceSets.main.output
	}
	integrationTest {
		// testSupport.output so integration `latest/` tests can import the shared stub DSL in support/.
		compileClasspath += sourceSets.main.output + sourceSets.testSupport.output
		runtimeClasspath += sourceSets.main.output + sourceSets.testSupport.output
	}
	// Theme-2 measurement harness. Not a test layer: nothing in it asserts, so it can never redden
	// the build. It boots the real application against a Testcontainers Postgres loaded with
	// system/db/seed/demo-volume.sql and times what the application does today, so the theme-2
	// before/after numbers are measured rather than asserted. testSupport.output for
	// TestcontainersConfiguration.
	benchmark {
		compileClasspath += sourceSets.main.output + sourceSets.testSupport.output
		runtimeClasspath += sourceSets.main.output + sourceSets.testSupport.output
	}
}

configurations {
	testSupportImplementation.extendsFrom testImplementation
	testSupportRuntimeOnly.extendsFrom testRuntimeOnly
	componentTestImplementation.extendsFrom testSupportImplementation
	componentTestRuntimeOnly.extendsFrom testSupportRuntimeOnly
	contractTestImplementation.extendsFrom componentTestImplementation
	contractTestRuntimeOnly.extendsFrom componentTestRuntimeOnly
	integrationTestImplementation.extendsFrom testSupportImplementation
	integrationTestRuntimeOnly.extendsFrom testSupportRuntimeOnly
	benchmarkImplementation.extendsFrom testSupportImplementation
	benchmarkRuntimeOnly.extendsFrom testSupportRuntimeOnly
}

repositories {
	mavenCentral()
	// Fallback mirror in case Maven Central has a transient outage (502/503).
	maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Makes the dependency rule executable rather than aspirational: ArchitectureTest fails the
	// build when a framework import reaches the domain, or a package points the wrong way.
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.flywaydb:flyway-core'
	testImplementation 'org.flywaydb:flyway-database-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Shared stub helpers (support/) need WireMock; declared once here and inherited by the
	// component, contract, and integration layers via the testSupportImplementation extendsFrom chain.
	testSupportImplementation 'org.wiremock:wiremock-standalone:3.9.2'

	// Pact contract layer only (inherits the testSupport + test deps above). No broker and no
	// account: @PactFolder reads the consumer's pact out of the repo-owned shop/contracts/ folder.
	componentTestImplementation 'au.com.dius.pact.provider:junit5spring:4.6.14'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.withType(Test).configureEach {
	// Default Gradle mechanisms so test names + counts show in the console
	// (Gradle is otherwise silent on success). Applies to test + componentTest.
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
	afterSuite { desc, result ->
		if (desc.parent == null) {  // root suite only
			println "Test results: ${result.testCount} tests, " +
				"${result.successfulTestCount} passed, " +
				"${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
		}
	}
}

tasks.register('componentTest', Test) {
	description = 'Runs in-process component tests (requires Docker). Opt-in; not part of `build`.'
	group = 'verification'
	testClassesDirs = sourceSets.componentTest.output.classesDirs
	classpath = sourceSets.componentTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

tasks.register('contractTest', Test) {
	description = 'Runs Pact provider-verification contract tests (requires Docker). Opt-in; not part of `build`.'
	group = 'verification'
	testClassesDirs = sourceSets.contractTest.output.classesDirs
	classpath = sourceSets.contractTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('componentTest')
}

tasks.register('integrationTest', Test) {
	description = 'Runs narrow-integration tests against real Postgres via Testcontainers (requires Docker). Opt-in; not part of `build`.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

// The theme-2 measurement harness. Opt-in and never part of `build` or `check`: it takes minutes,
// needs Docker, and its output is numbers rather than a verdict.
//
//   ./gradlew benchmark
//
// Writes build/benchmark/theme2-baseline.md and echoes the same table to the console. The curated
// write-up of a run lives in docs/atdd/code/theme2-measurements.md — this task is what makes the
// after-numbers comparable to the before-numbers, because both are taken by the same code over the
// same deterministic seed.
tasks.register('benchmark', Test) {
	description = 'Measures what the application does today for each theme-2 capability (requires Docker). Opt-in; not part of `build`.'
	group = 'verification'
	testClassesDirs = sourceSets.benchmark.output.classesDirs
	classpath = sourceSets.benchmark.runtimeClasspath
	useJUnitPlatform()
	// A measurement is never up to date: the point is to take it again.
	outputs.upToDateWhen { false }
	// Fixed heap so the retained-heap column means the same thing on every machine, and large
	// enough to hold 100k hydrated Orders plus the JPA entities they were mapped from.
	maxHeapSize = '2g'
	// The harness prints its own report; Gradle's per-test logging would interleave with it.
	testLogging {
		events 'failed'
		showStandardStreams = true
	}
}

// Builds the external-system simulator image that the `*RealParityContractTest` classes run via
// Testcontainers. Kept a plain `docker build` rather than Testcontainers' ImageFromDockerfile
// because the simulator's Dockerfile uses BuildKit-only syntax (`RUN --mount=type=cache`) and
// ImageFromDockerfile drives docker-java's classic builder, which rejects it. Deliberately NOT a
// dependsOn of `contractTest`: the provider-verification and stub-side contract suites don't need
// the image and shouldn't pay for the build — the commit-stage workflow names this task explicitly
// alongside the real-parity run.
//
// Unlike backend-java's copy of this task, the "../../.." depth here is not coupled to gh-optivem's
// scaffolder: this variant is never scaffolded, so the path is just shop's own monorepo depth
// (system/multitier/backend-clean-java -> shop root).
tasks.register('externalSimulatorImage', Exec) {
	description = 'Builds the external-system simulator Docker image used by the real-mode parity contract tests.'
	group = 'verification'
	workingDir = file("${rootDir}/../../..")
	commandLine 'docker', 'build', '-t', 'myshop/external-system-simulators:contract-test', 'external-systems/simulators'
	environment 'DOCKER_BUILDKIT', '1'
}

// Lints every source set, including the opt-in ones kept off `build`. CI calls this instead of
// naming individual checkstyle tasks, so a new source set is linted the moment it is added —
// scaffolded projects run the full `check`, and anything shop skips here fails downstream instead.
tasks.register('checkstyleAll') {
	description = 'Runs checkstyle on all source sets (main, test, and the opt-in test layers).'
	group = 'verification'
	dependsOn tasks.withType(Checkstyle)
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
	}
}