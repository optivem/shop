# Production profile (SPRING_PROFILES_ACTIVE=prod), set by the cloud deploy for the production stage only
# (_deploy-stage.yml). Local and pipeline stacks run without it, so they keep their dev-friendly settings.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# No OpenAPI document or Swagger UI in production (B-PRG 4.4). Local and pipeline stacks keep them (signed-in callers
# only on the backends with auth, B-KC decision 1), since that is where the docs are read.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
