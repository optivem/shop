spring:
  jpa:
    # The harness prints its own report; 100k rows of show-sql would bury it.
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # This is what makes the statement counts exact rather than estimated.
        generate_statistics: true
  flyway:
    enabled: true
    locations: filesystem:../../db/migrations

allowed:
  origins: http://localhost

# The gateways are constructed but never called: nothing here places an order.
external:
  system-mode: real
erp:
  url: http://localhost:9999/erp
clock:
  url: http://localhost:9999/clock
tax:
  url: http://localhost:9999/tax
