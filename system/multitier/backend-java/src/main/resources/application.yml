spring:
  application:
    name: backend
  jackson:
    deserialization:
      ACCEPT_FLOAT_AS_INT: false
      ADJUST_DATES_TO_CONTEXT_TIME_ZONE: false
    default-timezone: UTC
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB_HOST:localhost}:${POSTGRES_DB_PORT:5432}/${POSTGRES_DB_NAME:app}
    username: ${POSTGRES_DB_USER:app}
    password: ${POSTGRES_DB_PASSWORD:app}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  # Tracing is always on in-process (it stamps trace_id/span_id onto every log line); export over OTLP
  # only happens when OTEL_EXPORTER_OTLP_ENDPOINT is set -- see OtlpExportEnvironmentPostProcessor.
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      "[service.name]": ${OTEL_SERVICE_NAME:myshop-backend-java}

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        "[traceId]": trace_id
        "[spanId]": span_id

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:8080}

auth:
  issuer-uri: ${AUTH_ISSUER_URI}
  jwk-set-uri: ${AUTH_JWK_SET_URI}
  audience: ${AUTH_AUDIENCE}

error:
  types:
    base-url: https://api.my-company.example/errors
    validation-error: ${error.types.base-url}/validation-error
    resource-not-found: ${error.types.base-url}/resource-not-found
    bad-request: ${error.types.base-url}/bad-request
    conflict: ${error.types.base-url}/conflict
    internal-server-error: ${error.types.base-url}/internal-server-error
    service-unavailable: ${error.types.base-url}/service-unavailable

external:
  system-mode: ${EXTERNAL_SYSTEM_MODE:real}

erp:
  url: ${ERP_API_URL:http://localhost:9001/erp}
clock:
  url: ${CLOCK_API_URL:http://localhost:9001/clock}
tax:
  url: ${TAX_API_URL:http://localhost:9001/tax}
