server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend (must come before / location)
    location ^~ /api/ {
        proxy_pass ${BACKEND_API_URL};
        proxy_http_version 1.1;

        # Backends behind a shared HTTPS front (Cloud Run) route on SNI and Host
        proxy_ssl_server_name on;

        # Forward headers
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Runtime config for the SPA, rendered from container env vars (exact match wins over the asset regex below)
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        # Security headers (REL #78). add_header is not inherited into a location that has its own, so every
        # location that adds a header repeats them; /api/ has none of its own and passes the backend's.
        # SAMEORIGIN / frame-ancestors 'self', not DENY: oidc-client-ts's silent sign-in loads redirect_uri (this app)
        # in an iframe of this app.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ${KEYCLOAK_URL} ${OTEL_BROWSER_EXPORTER_OTLP_ENDPOINT}; frame-src 'self' ${KEYCLOAK_URL}; form-action 'self' ${KEYCLOAK_URL}; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        return 200 'window.__APP_CONFIG__ = {"keycloakUrl":"${KEYCLOAK_URL}","keycloakRealm":"${KEYCLOAK_REALM}","keycloakClientId":"${KEYCLOAK_CLIENT_ID}","otelExporterOtlpEndpoint":"${OTEL_BROWSER_EXPORTER_OTLP_ENDPOINT}"};';
    }

    # index.html and the unhashed public/ files (images): revalidate every time (a cheap 304 via ETag),
    # so a deploy shows up on the next load. Marking these immutable kept a stale stylesheet in
    # returning browsers until a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ${KEYCLOAK_URL} ${OTEL_BROWSER_EXPORTER_OTLP_ENDPOINT}; frame-src 'self' ${KEYCLOAK_URL}; form-action 'self' ${KEYCLOAK_URL}; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # Vite's build output: content-hashed names, so a changed file always gets a new URL
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ${KEYCLOAK_URL} ${OTEL_BROWSER_EXPORTER_OTLP_ENDPOINT}; frame-src 'self' ${KEYCLOAK_URL}; form-action 'self' ${KEYCLOAK_URL}; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
