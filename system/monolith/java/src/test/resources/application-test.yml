spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: filesystem:../../db/migrations

external:
  system-mode: real

erp:
  url: http://localhost:9999/erp
clock:
  url: http://localhost:9999/clock

error:
  types:
    base-url: https://api.my-company.example/errors
    validation-error: ${error.types.base-url}/validation-error
    resource-not-found: ${error.types.base-url}/resource-not-found
    bad-request: ${error.types.base-url}/bad-request
    conflict: ${error.types.base-url}/conflict
    internal-server-error: ${error.types.base-url}/internal-server-error
    service-unavailable: ${error.types.base-url}/service-unavailable

# Short waits keep failure-path tests fast, and stop a breaker opened by one test from rejecting the
# next test's calls for the production 10s.
resilience:
  retry:
    initial-backoff: 10ms
  circuit-breaker:
    wait-in-open-state: 100ms
