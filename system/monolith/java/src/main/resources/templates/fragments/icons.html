<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  The few Lucide icons (ISC licence, https://lucide.dev) the Market storefront uses, as inline SVG: the same icons
  frontend-react renders with lucide-react and the .NET monolith renders from Pages/Storefront/Icons.cs. They are
  decorative (aria-hidden) and carry no text, so they never change the text content the UI drivers read.
  Usage: th:replace="~{fragments/icons :: icon('truck', 14, null, 2)}"
  (name, size in px, extra CSS class or null, stroke width).
-->
<svg th:fragment="icon(name, size, cssClass, strokeWidth)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" th:attr="width=${size},height=${size},stroke-width=${strokeWidth}"
     stroke-linecap="round" stroke-linejoin="round" th:class="${cssClass}" aria-hidden="true" focusable="false"
     th:switch="${name}">
    <th:block th:case="'truck'"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></th:block>
    <th:block th:case="'shopping-cart'"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></th:block>
    <th:block th:case="'arrow-right'"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></th:block>
    <th:block th:case="'arrow-left'"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></th:block>
    <th:block th:case="'sliders-horizontal'"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></th:block>
    <th:block th:case="'minus'"><path d="M5 12h14"/></th:block>
    <th:block th:case="'plus'"><path d="M5 12h14"/><path d="M12 5v14"/></th:block>
    <th:block th:case="'check'"><path d="M20 6 9 17l-5-5"/></th:block>
    <th:block th:case="'trash'"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></th:block>
    <th:block th:case="'refresh-cw'"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></th:block>
    <th:block th:case="'chevron-right'"><path d="m9 18 6-6-6-6"/></th:block>
    <th:block th:case="'circle-check'"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></th:block>
</svg>
</body>
</html>
