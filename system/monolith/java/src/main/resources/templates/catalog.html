<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::#page-content}, false)}">
<head>
    <title>MyShop</title>
</head>
<body>
<!-- `/` (storefront-ux §4.1, UC-006): browse, search, filter and sort the catalog; add a product with quantity 1. -->
<div id="page-content">
    <!-- The home hero and two promo tiles: the only stock photos (static/css/images/promo/, credited in the footer). -->
    <section class="promo-tiles mb-4" aria-label="Promotions">
        <div class="promo-hero">
            <img class="promo-photo promo-photo-hero" src="/css/images/promo/laptop.jpg" alt="Laptop on a white desk">
            <div class="promo-hero-panel">
                <span class="badge badge-deal">New season</span>
                <h1 class="promo-hero-title">New season laptops</h1>
                <p class="lead">Free shipping over $1,000</p>
                <a href="/?category=Laptops" class="btn btn-primary">Shop laptops</a>
            </div>
        </div>
        <div class="promo-side">
            <a href="/?category=Monitors" class="promo-tile">
                <img class="promo-photo" src="/css/images/promo/monitor.jpg" alt="Monitor on a desk" loading="lazy">
                <span class="promo-tile-label">Shop monitors <svg th:replace="~{fragments/icons :: icon('arrow-right', 16, null, 2)}"></svg></span>
            </a>
            <a href="/?category=Accessories" class="promo-tile">
                <img class="promo-photo" src="/css/images/promo/keyboard.jpg" alt="Mechanical keyboard" loading="lazy">
                <span class="promo-tile-label">Build your desk setup <svg th:replace="~{fragments/icons :: icon('arrow-right', 16, null, 2)}"></svg></span>
            </a>
        </div>
    </section>
    <div class="catalog-layout">
        <aside class="catalog-sidebar">
            <button type="button" class="btn btn-outline-secondary w-100 d-lg-none" aria-expanded="false"
                    id="filtersToggle"><svg th:replace="~{fragments/icons :: icon('sliders-horizontal', 16, 'me-2', 2)}"></svg> Filters</button>
            <!-- A plain GET form: the query lives in the page address (BR-7), so a filtered view can be bookmarked. -->
            <form id="catalogQuery" method="get" action="/" class="d-none d-lg-block">
                <input type="hidden" name="q" th:value="${query.q()}">
                <div class="catalog-filters">
                    <fieldset aria-label="Category Filter">
                        <legend class="catalog-filter-legend">Category</legend>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="category" id="category-all" value=""
                                   th:checked="${query.category() == ''}">
                            <label class="form-check-label" for="category-all">All</label>
                        </div>
                        <div class="form-check" th:each="category : ${filterCategories}">
                            <input class="form-check-input" type="radio" name="category"
                                   th:id="${'category-' + category}" th:value="${category}"
                                   th:checked="${query.category() == category}">
                            <label class="form-check-label" th:for="${'category-' + category}" th:text="${category}">Category</label>
                        </div>
                    </fieldset>
                    <fieldset aria-label="Brand Filter">
                        <legend class="catalog-filter-legend">Brand</legend>
                        <div class="form-check" th:each="brand : ${filterBrands}">
                            <input class="form-check-input" type="checkbox" name="brand"
                                   th:id="${'brand-' + brand}" th:value="${brand}"
                                   th:checked="${query.isBrandTicked(brand)}">
                            <label class="form-check-label" th:for="${'brand-' + brand}" th:text="${brand}">Brand</label>
                        </div>
                    </fieldset>
                    <noscript><button type="submit" class="btn btn-outline-primary btn-sm">Apply filters</button></noscript>
                </div>
            </form>
        </aside>
        <section class="catalog-results" aria-label="Catalog">
            <div class="catalog-toolbar">
                <p class="mb-0">
                    <strong aria-label="Product Count"
                            th:text="${(unavailable ? 0 : #lists.size(shown)) + ((!unavailable and #lists.size(shown) == 1) ? ' product' : ' products')}">0 products</strong>
                    <span class="text-body-secondary"
                          th:text="${'in ' + (query.category() != '' ? query.category() : 'All products')}">in All products</span>
                </p>
                <div class="d-flex align-items-center gap-2">
                    <label for="catalog-sort" class="form-label mb-0 text-body-secondary">Sort by</label>
                    <select id="catalog-sort" name="sort" form="catalogQuery" class="form-select w-auto" aria-label="Sort">
                        <option th:each="option : ${sortOptions}" th:value="${option.value()}"
                                th:selected="${query.sort() == option.value()}" th:text="${option.label()}">Featured</option>
                    </select>
                </div>
            </div>

            <div th:if="${unavailable}" class="alert alert-danger" role="alert" th:text="${unavailableMessage}">
                Products are temporarily unavailable.
            </div>

            <div th:if="${!unavailable and #lists.isEmpty(shown)}" class="market-empty text-center py-5 px-3">
                <p class="lead">No products match your search.</p>
                <a href="/" class="btn btn-outline-primary" aria-label="Clear Filters">Clear filters</a>
            </div>

            <div th:if="${!unavailable and !#lists.isEmpty(shown)}" class="product-grid" aria-label="Product List">
                <!-- One catalog tile: image and title link to the product page; "Add to cart" adds quantity 1. -->
                <article th:each="product : ${shown}" class="product-card card h-100"
                         th:attr="aria-label=${'Product ' + product.sku}">
                    <a th:href="${'/products/' + #uris.escapePathSegment(product.sku)}" class="product-card-media"
                       tabindex="-1" aria-hidden="true">
                        <div th:replace="~{fragments/product-image :: image(${product.brand}, 'card')}"></div>
                    </a>
                    <div class="product-card-body">
                        <div class="product-card-brand" aria-label="Product Brand" th:text="${product.brand}">Brand</div>
                        <h3 class="product-card-title">
                            <a th:href="${'/products/' + #uris.escapePathSegment(product.sku)}" class="product-title-link"
                               aria-label="Product Title" th:text="${product.title}">Title</a>
                        </h3>
                        <p th:if="${!#strings.isEmpty(product.description)}" class="product-card-spec"
                           th:text="${product.description}">Description</p>
                        <div class="price product-card-price" aria-label="Display Price" th:text="${money.format(product.price)}">$0.00</div>
                        <form method="post" th:action="@{/cart/add}" class="mt-auto">
                            <input type="hidden" name="sku" th:value="${product.sku}">
                            <input type="hidden" name="quantity" value="1">
                            <input type="hidden" name="returnUrl" th:value="${returnUrl}">
                            <button type="submit" class="btn btn-primary w-100"
                                    th:attr="aria-label=${'Add ' + product.sku + ' to Cart'}">Add to cart</button>
                        </form>
                    </div>
                </article>
            </div>
        </section>
    </div>

    <script>
        (function () {
            var form = document.getElementById('catalogQuery');
            // Filters apply as soon as they change, like the other storefronts.
            form.addEventListener('change', function () { form.submit(); });
            document.getElementById('catalog-sort').addEventListener('change', function () { form.submit(); });
            var toggle = document.getElementById('filtersToggle');
            toggle.addEventListener('click', function () {
                var open = form.classList.toggle('d-none');
                form.classList.toggle('mt-3', !open);
                toggle.setAttribute('aria-expanded', String(!open));
            });
        })();
    </script>
</div>
</body>
</html>
