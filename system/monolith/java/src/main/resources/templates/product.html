<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::#page-content}, false)}">
<head>
    <title th:text="${product != null ? product.title + ' · MyShop' : 'Product · MyShop'}">Product · MyShop</title>
</head>
<body>
<!-- `/products/{sku}` (storefront-ux §4.2, UC-007): one product's details, with a quantity and "Add to cart". -->
<div id="page-content">
    <div th:if="${product == null}" class="alert alert-danger" role="alert" th:text="${unavailableMessage}">
        Products are temporarily unavailable.
    </div>

    <th:block th:if="${product != null}">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item">
                    <a th:href="${'/?category=' + #uris.escapeQueryParam(product.category)}" th:text="${product.category}">Category</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.title}">Product</li>
            </ol>
        </nav>

        <div class="product-detail">
            <div class="product-detail-media market-panel">
                <div th:replace="~{fragments/product-image :: image(${product.imageUrl}, ${product.title}, ${product.brand}, 'card', false)}"></div>
            </div>
            <div class="product-detail-info">
                <form method="post" th:action="@{/cart/add}" class="market-panel product-buy-box">
                    <input type="hidden" name="sku" th:value="${product.sku}">
                    <input type="hidden" name="returnUrl" th:value="${returnUrl}">
                    <p class="product-meta mb-0">
                        <span class="product-meta-brand" aria-label="Product Brand" th:text="${product.brand}">Brand</span><span class="product-meta-sep" aria-hidden="true">/</span><span aria-label="Product Category" th:text="${product.category}">Category</span>
                    </p>
                    <h1 class="product-detail-title" aria-label="Product Title" th:text="${product.title}">Title</h1>
                    <p class="product-meta mb-0">
                        SKU <span class="font-monospace text-body" aria-label="Product SKU" th:text="${product.sku}">SKU</span>
                    </p>
                    <p class="price product-detail-price" aria-label="Display Price" th:text="${money.format(product.price)}">$0.00</p>
                    <div class="product-buy-row">
                        <label for="product-quantity" class="visually-hidden">Quantity</label>
                        <div class="input-group quantity-stepper quantity-stepper-lg">
                            <button type="button" class="btn btn-outline-secondary" aria-label="Decrease Quantity"
                                    data-step="-1"><svg th:replace="~{fragments/icons :: icon('minus', 16, null, 2)}"></svg></button>
                            <input id="product-quantity" name="quantity" type="text" inputmode="numeric"
                                   class="form-control text-center" aria-label="Product Quantity" value="1">
                            <button type="button" class="btn btn-outline-secondary" aria-label="Increase Quantity"
                                    data-step="1"><svg th:replace="~{fragments/icons :: icon('plus', 16, null, 2)}"></svg></button>
                        </div>
                        <button type="submit" class="btn btn-cta btn-lg product-add-button" aria-label="Add to Cart">
                            <svg th:replace="~{fragments/icons :: icon('shopping-cart', 18, 'me-2', 2)}"></svg>Add to cart
                        </button>
                    </div>
                </form>
                <ul class="service-tiles service-tiles-compact" aria-label="Our services">
                    <li class="service-tile">
                        <span class="service-tile-icon" aria-hidden="true"><svg th:replace="~{fragments/icons :: icon('truck', 18, null, 2)}"></svg></span>
                        <span><strong class="service-tile-title">Free shipping</strong><span class="service-tile-detail">on orders over $1,000</span></span>
                    </li>
                    <li class="service-tile">
                        <span class="service-tile-icon" aria-hidden="true"><svg th:replace="~{fragments/icons :: icon('rotate-ccw', 18, null, 2)}"></svg></span>
                        <span><strong class="service-tile-title">30-day returns</strong><span class="service-tile-detail">send it back within a month</span></span>
                    </li>
                    <li class="service-tile">
                        <span class="service-tile-icon" aria-hidden="true"><svg th:replace="~{fragments/icons :: icon('shield-check', 18, null, 2)}"></svg></span>
                        <span><strong class="service-tile-title">Secure checkout</strong><span class="service-tile-detail">signed in with your account</span></span>
                    </li>
                </ul>
                <section class="market-panel product-about" aria-labelledby="product-about-heading">
                    <h2 class="product-about-title" id="product-about-heading">About this product</h2>
                    <p class="product-detail-description mb-0" aria-label="Product Description"
                       th:text="${product.description}">Description</p>
                </section>
            </div>
        </div>

        <script>
            (function () {
                // The stepper moves by 1 within 1..99; a typed quantity is checked by the server when added.
                var input = document.getElementById('product-quantity');
                document.querySelectorAll('[data-step]').forEach(function (button) {
                    button.addEventListener('click', function () {
                        var current = /^\d+$/.test(input.value.trim()) ? Number(input.value.trim()) : 1;
                        if (current < 1 || current > 99) current = 1;
                        var next = Math.min(99, Math.max(1, current + Number(button.getAttribute('data-step'))));
                        input.value = String(next);
                    });
                });
            })();
        </script>
    </th:block>
</div>
</body>
</html>
