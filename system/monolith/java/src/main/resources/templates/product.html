<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::#page-content}, false)}">
<head>
    <title th:text="${product != null ? product.title + ' · MyShop' : 'Product · MyShop'}">Product · MyShop</title>
</head>
<body>
<!-- `/products/{sku}` (storefront-ux §4.2, UC-007): one product's details, with a quantity and "Add to cart". -->
<div id="page-content">
    <div th:if="${product == null}" class="alert alert-danger" role="alert" th:text="${unavailableMessage}">
        Products are temporarily unavailable.
    </div>

    <th:block th:if="${product != null}">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item">
                    <a th:href="${'/?category=' + #uris.escapeQueryParam(product.category)}" th:text="${product.category}">Category</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.title}">Product</li>
            </ol>
        </nav>

        <div class="row g-4 align-items-start">
            <div class="col-lg-7">
                <div class="market-panel p-3">
                    <div th:replace="~{fragments/product-image :: image(${product.brand}, 'square')}"></div>
                </div>
            </div>
            <div class="col-lg-5 d-flex flex-column gap-3">
                <div class="market-panel p-4">
                    <p class="product-meta mb-2">
                        <span class="product-meta-brand" aria-label="Product Brand" th:text="${product.brand}">Brand</span>
                        · <span aria-label="Product Category" th:text="${product.category}">Category</span>
                    </p>
                    <h1 class="product-detail-title" aria-label="Product Title" th:text="${product.title}">Title</h1>
                    <p class="product-meta mb-3">
                        SKU <span class="font-monospace text-body" aria-label="Product SKU" th:text="${product.sku}">SKU</span>
                    </p>
                    <p class="price product-detail-price" aria-label="Display Price" th:text="${money.format(product.price)}">$0.00</p>
                    <p class="product-detail-description mb-0" aria-label="Product Description"
                       th:text="${product.description}">Description</p>
                </div>
                <form method="post" th:action="@{/cart/add}" class="market-panel p-4 d-flex flex-column gap-3">
                    <input type="hidden" name="sku" th:value="${product.sku}">
                    <input type="hidden" name="returnUrl" th:value="${returnUrl}">
                    <div class="d-flex align-items-center justify-content-between gap-3">
                        <label for="product-quantity" class="form-label fw-bold mb-0">Quantity</label>
                        <div class="input-group quantity-stepper">
                            <button type="button" class="btn btn-outline-secondary" aria-label="Decrease Quantity"
                                    data-step="-1"><svg th:replace="~{fragments/icons :: icon('minus', 16, null, 2)}"></svg></button>
                            <input id="product-quantity" name="quantity" type="text" inputmode="numeric"
                                   class="form-control text-center" aria-label="Product Quantity" value="1">
                            <button type="button" class="btn btn-outline-secondary" aria-label="Increase Quantity"
                                    data-step="1"><svg th:replace="~{fragments/icons :: icon('plus', 16, null, 2)}"></svg></button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100" aria-label="Add to Cart">
                        <svg th:replace="~{fragments/icons :: icon('shopping-cart', 18, 'me-2', 2)}"></svg>Add to cart
                    </button>
                    <ul class="product-perks list-unstyled mb-0">
                        <li><svg th:replace="~{fragments/icons :: icon('check', 16, null, 2)}"></svg> Free shipping on orders over $1,000</li>
                        <li><svg th:replace="~{fragments/icons :: icon('check', 16, null, 2)}"></svg> 30-day returns</li>
                    </ul>
                </form>
            </div>
        </div>

        <script>
            (function () {
                // The stepper moves by 1 within 1..99; a typed quantity is checked by the server when added.
                var input = document.getElementById('product-quantity');
                document.querySelectorAll('[data-step]').forEach(function (button) {
                    button.addEventListener('click', function () {
                        var current = /^\d+$/.test(input.value.trim()) ? Number(input.value.trim()) : 1;
                        if (current < 1 || current > 99) current = 1;
                        var next = Math.min(99, Math.max(1, current + Number(button.getAttribute('data-step'))));
                        input.value = String(next);
                    });
                });
            })();
        </script>
    </th:block>
</div>
</body>
</html>
