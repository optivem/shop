spring:
  application:
    name: myShop
  jackson:
    deserialization:
      ACCEPT_FLOAT_AS_INT: false
      ADJUST_DATES_TO_CONTEXT_TIME_ZONE: false
    default-timezone: UTC
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB_HOST:localhost}:${POSTGRES_DB_PORT:5432}/${POSTGRES_DB_NAME:app}
    username: ${POSTGRES_DB_USER:app}
    password: ${POSTGRES_DB_PASSWORD:app}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  thymeleaf:
    cache: false

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

auth:
  # Browser-facing issuer (what appears in tokens' iss and in the login redirect); the server-to-server
  # endpoints may differ inside Docker, hence the separate overrides.
  issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8191/realms/shop}
  authorization-uri: ${AUTH_AUTHORIZATION_URI:${auth.issuer-uri}/protocol/openid-connect/auth}
  token-uri: ${AUTH_TOKEN_URI:${auth.issuer-uri}/protocol/openid-connect/token}
  jwk-set-uri: ${AUTH_JWK_SET_URI:${auth.issuer-uri}/protocol/openid-connect/certs}
  end-session-uri: ${AUTH_END_SESSION_URI:${auth.issuer-uri}/protocol/openid-connect/logout}
  audience: ${AUTH_AUDIENCE:shop-backend}
  client-id: ${AUTH_CLIENT_ID:shop-monolith}
  # Clearly-marked test-realm value; supply a real secret via the environment outside local/pipeline stacks.
  client-secret: ${AUTH_CLIENT_SECRET:shop-monolith-test-secret}

error:
  types:
    base-url: https://api.my-company.example/errors
    validation-error: ${error.types.base-url}/validation-error
    resource-not-found: ${error.types.base-url}/resource-not-found
    bad-request: ${error.types.base-url}/bad-request
    internal-server-error: ${error.types.base-url}/internal-server-error

external:
  system-mode: ${EXTERNAL_SYSTEM_MODE:real}

erp:
  url: ${ERP_API_URL:http://localhost:9001/erp}
clock:
  url: ${CLOCK_API_URL:http://localhost:9001/clock}
tax:
  url: ${TAX_API_URL:http://localhost:9001/tax}
