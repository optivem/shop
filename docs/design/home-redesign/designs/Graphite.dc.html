<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyShop — Home (Graphite)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F8}
a{color:#0B0B0C;text-decoration:none}a:hover{color:#2B50E6}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #2B50E6;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; background: #F7F7F8; color: #0B0B0C; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<header style="position: sticky; top: 0; z-index: 5; background: rgba(247,247,248,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid #E4E5E8">
<div style="max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
<a href="#" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">myshop<span style="color: {{accent}}">.</span></a>
<nav aria-label="Store navigation" style="display: flex; gap: 24px; font-size: 14px; font-weight: 500">
<a href="#">Catalog</a>
<a href="#">Orders</a>
<a href="#">Account</a>
</nav>
<form role="search" style="flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E4E5E8; border-radius: 999px; padding: 4px 4px 4px 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5E66" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search Products" placeholder="Search laptops, audio, displays…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 8px 0; color: #0B0B0C">
<button type="button" aria-label="Search" style="border: 0; border-radius: 999px; background: #0B0B0C; color: #FFFFFF; padding: 8px 18px; font-weight: 500; cursor: pointer; min-height: 40px">Search</button>
</form>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" style="border: 1px solid #E4E5E8; background: #FFFFFF; border-radius: 999px; padding: 8px 16px; font-weight: 500; cursor: pointer; min-height: 44px">Sign in</button>
<a href="#" aria-label="Cart" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E5E8">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
<span aria-label="Cart Item Count" style="position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{cartCount}}</span>
</a>
</div>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 32px 24px 80px">

<section style="background: #0B0B0C; color: #FFFFFF; border-radius: 24px; padding: 56px 48px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 40px">
<div style="max-width: 560px">
<p style="margin: 0 0 12px; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #A9ACB4">This season</p>
<h1 style="margin: 0 0 12px; font-family: 'Space Grotesk', sans-serif; font-size: 52px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 600">New season laptops</h1>
<p style="margin: 0; font-size: 17px; color: #C9CBD1">Free shipping over $1,000</p>
</div>
<a href="#" style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; color: #0B0B0C; border-radius: 999px; padding: 14px 24px; font-weight: 600; min-height: 48px; box-sizing: border-box">Shop laptops <span aria-hidden="true">→</span></a>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">

<aside style="flex: 1 1 220px; max-width: 260px; display: flex; flex-direction: column; gap: 28px">
<fieldset aria-label="Category Filter" style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5B5E66; margin-bottom: 12px">Category</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{categories}}" as="cat" hint-placeholder-count="5">
<div class="form-check" style="margin: 0; padding: 0">
<label style="{{cat.chipStyle}}"><input type="checkbox" checked="{{cat.selected}}" onChange="{{cat.pick}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">{{cat.name}}</label>
</div>
</sc-for>
</div>
</fieldset>
<fieldset aria-label="Brand Filter" style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5B5E66; margin-bottom: 12px">Brand</legend>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{brands}}" as="b" hint-placeholder-count="4">
<div class="form-check" style="margin: 0; padding: 0">
<label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B0B0C; margin: 0">{{b}}</label>
</div>
</sc-for>
</div>
</fieldset>
<button type="button" aria-label="Clear Filters" onClick="{{clear}}" style="align-self: flex-start; border: 0; background: transparent; color: {{accent}}; font-weight: 500; padding: 0; cursor: pointer; min-height: 44px">Clear filters</button>
</aside>

<section aria-label="Catalog" style="flex: 999 1 560px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px">
<p aria-label="Product Count" style="margin: 0; color: #5B5E66; font-size: 14px"><strong style="color: #0B0B0C; font-weight: 600">{{count}}</strong> products</p>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5B5E66">Sort by
<select aria-label="Sort" style="border: 1px solid #E4E5E8; background: #FFFFFF; border-radius: 10px; padding: 8px 12px; color: #0B0B0C; min-height: 40px">
<option>Featured</option>
<option>Price: low to high</option>
<option>Price: high to low</option>
<option>Newest</option>
</select>
</label>
</div>

<div aria-label="Product List" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 20px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="8">
<article style="background: #FFFFFF; border: 1px solid #ECEDF0; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<a href="#" style="display: flex; align-items: center; justify-content: center; aspect-ratio: 4 / 3; background: #EFF0F3">
<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#8A8D95" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{p.title}}"><path d="{{p.icon}}"></path></svg>
</a>
<div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px; flex: 1">
<p style="margin: 0; font-size: 12px; color: #5B5E66">{{p.brand}} · {{p.category}}</p>
<h2 style="margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em"><a href="#">{{p.title}}</a></h2>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 14px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">{{p.price}}</span>
<button type="button" aria-label="Add to Cart" onClick="{{add}}" style="border: 1px solid #0B0B0C; background: #FFFFFF; color: #0B0B0C; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 40px">Add to cart</button>
</div>
</div>
</article>
</sc-for>
</div>
</section>
</div>
</main>

<footer style="border-top: 1px solid #E4E5E8">
<div style="max-width: 1280px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; color: #5B5E66">
<span>© MyShop</span>
<span>Free shipping over $1,000 · 30-day returns</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B50E6","options":["#2B50E6","#0B0B0C","#C2410C","#047857"]},"$preview":{"width":1440,"height":1480}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cart: 2, cat: null }; }
  renderVals() {
    const accent = this.props.accent ?? '#2B50E6';
    const I = {
      Laptops: 'M4 6h16v10H4z M2 19h20',
      Audio: 'M4 15v-3a8 8 0 0 1 16 0v3 M4 15h3v5H4z M17 15h3v5h-3z',
      Displays: 'M3 4h18v12H3z M8 20h8 M12 16v4',
      Accessories: 'M2 7h20v10H2z M6 11h.01 M10 11h.01 M14 11h.01 M18 11h.01 M7 14h10',
      Wearables: 'M7 7h10v10H7z M9 7l1-4h4l1 4 M9 17l1 4h4l1-4'
    };
    const all = [
      { title: 'Arc 14 Laptop', brand: 'Northwind', category: 'Laptops', price: '$1,299' },
      { title: 'Arc 16 Pro Laptop', brand: 'Northwind', category: 'Laptops', price: '$1,899' },
      { title: 'Pulse Wireless Earbuds', brand: 'Halcyon', category: 'Audio', price: '$149' },
      { title: 'Lumen 27 4K Monitor', brand: 'Volta', category: 'Displays', price: '$449' },
      { title: 'Drift Mechanical Keyboard', brand: 'Kestrel', category: 'Accessories', price: '$129' },
      { title: 'Orbit Smartwatch', brand: 'Halcyon', category: 'Wearables', price: '$279' },
      { title: 'Studio Over-Ear Headphones', brand: 'Halcyon', category: 'Audio', price: '$329' },
      { title: 'Beam USB-C Hub', brand: 'Kestrel', category: 'Accessories', price: '$59' }
    ];
    const products = all.filter(p => !this.state.cat || p.category === this.state.cat).map(p => ({ ...p, icon: I[p.category] }));
    const base = 'display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; position: relative; ';
    const categories = Object.keys(I).map(name => {
      const selected = this.state.cat === name;
      return {
        name, selected,
        chipStyle: base + (selected ? 'background: #0B0B0C; color: #FFFFFF; border: 1px solid #0B0B0C' : 'background: #FFFFFF; color: #0B0B0C; border: 1px solid #E4E5E8'),
        pick: () => this.setState({ cat: selected ? null : name })
      };
    });
    return {
      accent, products, categories,
      brands: ['Halcyon', 'Kestrel', 'Northwind', 'Volta'],
      count: products.length,
      cartCount: this.state.cart,
      add: () => this.setState({ cart: this.state.cart + 1 }),
      clear: () => this.setState({ cat: null })
    };
  }
}
</script>
</body>
</html>
