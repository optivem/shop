<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyShop — Home (Tonal)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#16181D;text-decoration:none}a:hover{color:#1F5FD6}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #1F5FD6;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; color: #16181D; font-family: Manrope, system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<header>
<div style="max-width: 1280px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<a href="#" style="display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9px; background: #1F5FD6; display: inline-block"></span>myshop</a>
<nav aria-label="Store navigation" style="display: flex; gap: 4px; font-size: 14px; font-weight: 600">
<a href="#" style="padding: 10px 16px; border-radius: 999px; background: #E8EFFC; color: #123F96">Catalog</a>
<a href="#" style="padding: 10px 16px; border-radius: 999px">Orders</a>
<a href="#" style="padding: 10px 16px; border-radius: 999px">Account</a>
</nav>
<form role="search" style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; background: #F1F3F6; border-radius: 999px; padding: 4px 4px 4px 18px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5562" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search Products" placeholder="Search products, brands, specs" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 10px 0; color: #16181D">
<button type="button" aria-label="Search" style="border: 0; border-radius: 999px; background: #1F5FD6; color: #FFFFFF; padding: 0 20px; font-weight: 700; cursor: pointer; min-height: 40px">Search</button>
</form>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" style="border: 0; background: transparent; border-radius: 999px; padding: 0 16px; font-weight: 600; cursor: pointer; min-height: 44px; color: #1F5FD6">Sign in</button>
<a href="#" aria-label="Cart" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; background: #F1F3F6; font-weight: 700; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
<span aria-label="Cart Item Count">2</span>
</a>
</div>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 8px 24px 80px">

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 40px">
<div style="grid-column: span 2; background: #E8EFFC; border-radius: 28px; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; min-height: 320px; box-sizing: border-box">
<div>
<span style="display: inline-block; background: #FFFFFF; color: #123F96; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700">New season</span>
<h1 style="margin: 20px 0 10px; font-size: 56px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; max-width: 560px">New season laptops</h1>
<p style="margin: 0; font-size: 17px; color: #3A4252">Free shipping over $1,000</p>
</div>
<a href="#" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: #1F5FD6; color: #FFFFFF; border-radius: 999px; padding: 0 24px; min-height: 48px; font-weight: 700">Shop laptops</a>
</div>
<div style="background: #FCEFE3; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 320px; box-sizing: border-box">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#8A4A12" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3 M4 15h3v5H4z M17 15h3v5h-3z"></path></svg>
<div>
<h2 style="margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; font-weight: 800">Audio</h2>
<a href="#" style="font-weight: 700; color: #8A4A12">Browse audio →</a>
</div>
</div>
</section>

<section aria-label="Catalog">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px">
<fieldset aria-label="Category Filter" style="border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Category</legend>
<sc-for list="{{categories}}" as="c" hint-placeholder-count="5">
<div class="form-check" style="margin: 0; padding: 0">
<label style="{{c.style}}"><input type="checkbox" checked="{{c.selected}}" style="position: absolute; opacity: 0; width: 1px; height: 1px"><sc-if value="{{c.selected}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#123F96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>{{c.name}}</label>
</div>
</sc-for>
</fieldset>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<select aria-label="Brand Filter" style="border: 1px solid #D5D9E0; background: #FFFFFF; border-radius: 12px; padding: 0 14px; min-height: 40px; color: #16181D; font-weight: 600"><option>All brands</option><option>Halcyon</option><option>Kestrel</option><option>Northwind</option><option>Volta</option></select>
<select aria-label="Sort" style="border: 1px solid #D5D9E0; background: #FFFFFF; border-radius: 12px; padding: 0 14px; min-height: 40px; color: #16181D; font-weight: 600"><option>Sort: Featured</option><option>Price: low to high</option><option>Price: high to low</option></select>
<button type="button" aria-label="Clear Filters" style="border: 0; background: transparent; color: #1F5FD6; font-weight: 700; padding: 0 12px; min-height: 40px; cursor: pointer">Clear filters</button>
</div>
</div>

<p aria-label="Product Count" style="margin: 0 0 16px; font-size: 14px; color: #4E5562; font-weight: 600">8 products</p>

<div aria-label="Product List" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="8">
<article style="background: #F6F7F9; border-radius: 24px; padding: 12px; display: flex; flex-direction: column; gap: 12px">
<a href="#" style="aspect-ratio: 1; background: #FFFFFF; border-radius: 18px; display: flex; align-items: center; justify-content: center">
<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#7B8392" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{p.title}}"><path d="{{p.icon}}"></path></svg>
</a>
<div style="padding: 0 8px 8px; display: flex; flex-direction: column; gap: 4px; flex: 1">
<span style="font-size: 12px; font-weight: 700; color: #4E5562">{{p.brand}}</span>
<h2 style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em"><a href="#">{{p.title}}</a></h2>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px">
<span style="font-size: 18px; font-weight: 800">{{p.price}}</span>
<button type="button" aria-label="Add to Cart" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: #1F5FD6; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
</div>
</div>
</article>
</sc-for>
</div>
</section>
</main>

<footer style="background: #F6F7F9">
<div style="max-width: 1280px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; color: #4E5562; font-weight: 600">
<span>© MyShop</span>
<span>Free shipping over $1,000 · 30-day returns</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1480}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      Laptops: 'M4 6h16v10H4z M2 19h20',
      Audio: 'M4 15v-3a8 8 0 0 1 16 0v3 M4 15h3v5H4z M17 15h3v5h-3z',
      Displays: 'M3 4h18v12H3z M8 20h8 M12 16v4',
      Accessories: 'M2 7h20v10H2z M6 11h.01 M10 11h.01 M14 11h.01 M18 11h.01 M7 14h10',
      Wearables: 'M7 7h10v10H7z M9 7l1-4h4l1 4 M9 17l1 4h4l1-4'
    };
    const rows = [
      ['Arc 14 Laptop', 'Northwind', 'Laptops', '$1,299'],
      ['Arc 16 Pro Laptop', 'Northwind', 'Laptops', '$1,899'],
      ['Pulse Wireless Earbuds', 'Halcyon', 'Audio', '$149'],
      ['Lumen 27-inch 4K Monitor', 'Volta', 'Displays', '$449'],
      ['Drift Mechanical Keyboard', 'Kestrel', 'Accessories', '$129'],
      ['Orbit Smartwatch', 'Halcyon', 'Wearables', '$279'],
      ['Studio Over-Ear Headphones', 'Halcyon', 'Audio', '$329'],
      ['Beam USB-C Hub', 'Kestrel', 'Accessories', '$59']
    ];
    const products = rows.map(r => ({ title: r[0], brand: r[1], icon: I[r[2]], price: r[3] }));
    const base = 'display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; position: relative; ';
    const categories = Object.keys(I).map((name, i) => ({
      name, selected: i === 0,
      style: base + (i === 0 ? 'background: #D6E3FB; color: #123F96; border: 1px solid #D6E3FB' : 'background: #FFFFFF; color: #16181D; border: 1px solid #D5D9E0')
    }));
    return { products, categories };
  }
}
</script>
</body>
</html>
