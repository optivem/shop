name: 'Deploy Keycloak to Cloud Run'
description: >-
  Deploys the one Keycloak every variant and stage shares, and waits for all its realms.
  Redeploys only when the image, a setting or the db credentials changed, so one workflow
  doesn't restart Keycloak under another's tests. Passes SYSTEM and RUN_APP_SUFFIX, which the
  image's realm files use as placeholders for the Cloud Run URLs (docker/keycloak/Dockerfile).
  Needs gcloud authenticated.

inputs:
  image:
    description: 'Keycloak image reference'
    required: true
  system:
    description: 'System name: prefixes the service, secrets and database'
    required: true
  project:
    description: 'GCP project ID'
    required: true
  project-number:
    description: 'GCP project number'
    required: true
  region:
    description: 'GCP region'
    required: true
  reconcile-prod-realm:
    description: >-
      'true' in the production stage: create or update the shop-prod realm's shop-monolith client
      through the admin API and set its secret from Secret Manager. Needs the repo checked out.
    required: false
    default: 'false'
  frontend-origins:
    description: >-
      Extra origins (space-separated, e.g. https://shop-acc.example.com) the acceptance realm's
      shop-frontend client must accept: added to its redirect URIs, post-logout redirect URIs and web
      origins through the admin API, because the realm file never reaches a realm that already exists.
      Add-only and idempotent. Empty (the default) changes nothing.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Deploy
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SYSTEM: ${{ inputs.system }}
        PROJECT: ${{ inputs.project }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        REGION: ${{ inputs.region }}
      run: |
        set -euo pipefail
        url() { echo "https://$1-${PROJECT_NUMBER}.${REGION}.run.app"; }
        db="$(gcloud secrets versions access latest --secret="${SYSTEM}-db")"
        db_host="$(jq -r .host <<< "$db")"; db_port="$(jq -r .port <<< "$db")"
        db_user="$(jq -r .user <<< "$db")"; db_password="$(jq -r .password <<< "$db")"
        echo "::add-mask::${db_password}"
        env_file="${RUNNER_TEMP}/keycloak-env.json"
        jq -n \
          --arg host "$(url "${SYSTEM}-keycloak")" \
          --arg dburl "jdbc:postgresql://${db_host}:${db_port}/${SYSTEM//-/_}_keycloak?sslmode=require" \
          --arg dbuser "$db_user" --arg dbpass "$db_password" \
          --arg system "$SYSTEM" --arg suffix "${PROJECT_NUMBER}.${REGION}.run.app" \
          '{KC_HOSTNAME:$host, KC_DB_URL:$dburl, KC_DB_USERNAME:$dbuser, KC_DB_PASSWORD:$dbpass,
            KC_BOOTSTRAP_ADMIN_USERNAME:"admin", SYSTEM:$system, RUN_APP_SUFFIX:$suffix}' > "$env_file"
        args=(--image "$IMAGE" --region "$REGION" --project "$PROJECT"
          --service-account "runtime@${PROJECT}.iam.gserviceaccount.com"
          --port 8080 --memory 1Gi --cpu 1 --cpu-boost
          --min-instances 0 --max-instances 2 --allow-unauthenticated
          --set-secrets "KC_BOOTSTRAP_ADMIN_PASSWORD=${SYSTEM}-keycloak-admin-password:latest")
        fingerprint="$(printf '%s\n' "${args[@]}" | cat - "$env_file" | sha256sum | cut -c1-32)"
        deployed="$(gcloud run services describe "${SYSTEM}-keycloak" --region "$REGION" --project "$PROJECT" \
          --format='value(metadata.labels.deploy_fingerprint)' 2> /dev/null || true)"
        if [[ "$deployed" == "$fingerprint" ]]; then
          echo "Keycloak is unchanged, not redeploying."
        else
          gcloud run deploy "${SYSTEM}-keycloak" "${args[@]}" \
            --env-vars-file "$env_file" --labels "deploy_fingerprint=${fingerprint}"
        fi
        rm -f "$env_file"

    - name: Wait for Keycloak (cold start + realm import)
      uses: optivem/actions/wait-for-endpoints@v1
      with:
        endpoints: |
          [
            {"name": "Keycloak shop", "url": "https://${{ inputs.system }}-keycloak-${{ inputs.project-number }}.${{ inputs.region }}.run.app/realms/shop/.well-known/openid-configuration"},
            {"name": "Keycloak shop-qa", "url": "https://${{ inputs.system }}-keycloak-${{ inputs.project-number }}.${{ inputs.region }}.run.app/realms/shop-qa/.well-known/openid-configuration"},
            {"name": "Keycloak shop-prod", "url": "https://${{ inputs.system }}-keycloak-${{ inputs.project-number }}.${{ inputs.region }}.run.app/realms/shop-prod/.well-known/openid-configuration"}
          ]
        max-attempts: '60'
        wait-seconds: '10'
        timeout-seconds: '900'

    # --import-realm skips realms that already exist, so a realm file change never reaches the live
    # shop-prod. This step applies the shop-monolith client from the same filters the image uses
    # (stage-realm.jq | prod-realm.jq) and sets its secret, which is never in git or in the image.
    # Create-or-update only: it never deletes a client or a realm. PUT leaves protocol mappers as they are.
    - name: Reconcile shop-prod monolith client
      if: inputs.reconcile-prod-realm == 'true'
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        REGION: ${{ inputs.region }}
      run: |
        set -euo pipefail
        suffix="${PROJECT_NUMBER}.${REGION}.run.app"
        kc="https://${SYSTEM}-keycloak-${suffix}"
        dir="${GITHUB_WORKSPACE}/docker/keycloak"
        secret="$(gcloud secrets versions access latest --secret="${SYSTEM}-monolith-client-secret")"
        echo "::add-mask::${secret}"
        admin_password="$(gcloud secrets versions access latest --secret="${SYSTEM}-keycloak-admin-password")"
        echo "::add-mask::${admin_password}"
        token="$(curl -fsS "${kc}/realms/master/protocol/openid-connect/token" \
          -d grant_type=password -d client_id=admin-cli -d username=admin \
          --data-urlencode "password=${admin_password}" | jq -r .access_token)"
        echo "::add-mask::${token}"
        client="$(jq -L "$dir" --arg realm shop-prod --arg stage production --arg system "$SYSTEM" --arg suffix "$suffix" \
            -f "${dir}/stage-realm.jq" "${dir}/shop-realm.json" \
          | jq -f "${dir}/prod-realm.jq" \
          | jq -c --arg secret "$secret" '.clients[] | select(.clientId == "shop-monolith") | .secret = $secret')"
        [[ -n "$client" ]] || { echo "::error::shop-monolith is missing from the production realm filters"; exit 1; }
        api="${kc}/admin/realms/shop-prod/clients"
        auth=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
        lookup() { curl -fsS "${auth[@]}" "${api}?clientId=shop-monolith" | jq -r '.[0].id // empty'; }
        id="$(lookup)"
        if [[ -z "$id" ]]; then
          # Every prod-stage variant shares this realm and meta-release promotes them in parallel, so
          # another variant can create the client between the lookup and the POST (409, meta-release
          # 42260249107): then fall through to updating the client it created.
          code="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" -X POST "$api" -d "$client")"
          case "$code" in
            201) echo "Created shop-monolith in shop-prod." ;;
            409) id="$(lookup)"; [[ -n "$id" ]] || { echo "::error::POST returned 409 but shop-monolith is not in shop-prod"; exit 1; } ;;
            *) echo "::error::Creating shop-monolith in shop-prod returned HTTP ${code}"; exit 1 ;;
          esac
        fi
        if [[ -n "$id" ]]; then
          curl -fsS "${auth[@]}" -X PUT "${api}/${id}" -d "$(jq -c --arg id "$id" '.id = $id' <<< "$client")" > /dev/null
          echo "Updated shop-monolith in shop-prod."
        fi

    # The custom domains of the permanent acceptance / E2E environments (docs/environments.md).
    # Add-only: never removes a URI, so other variants' run.app URLs stay as the realm file made them.
    - name: Allow custom-domain origins on shop-frontend
      if: inputs.frontend-origins != ''
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        REGION: ${{ inputs.region }}
        ORIGINS: ${{ inputs.frontend-origins }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 # ORIGINS is a space-separated list
        origins="$(printf '%s\n' $ORIGINS | jq -R . | jq -sc 'map(select(. != "") | sub("/+$"; ""))')"
        for o in $(jq -r '.[]' <<< "$origins"); do
          [[ "$o" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::Not an https origin: $o"; exit 1; }
        done
        [[ "$origins" != "[]" ]] || { echo "No frontend origins to add."; exit 0; }
        kc="https://${SYSTEM}-keycloak-${PROJECT_NUMBER}.${REGION}.run.app"
        admin_password="$(gcloud secrets versions access latest --secret="${SYSTEM}-keycloak-admin-password")"
        echo "::add-mask::${admin_password}"
        token="$(curl -fsS "${kc}/realms/master/protocol/openid-connect/token" \
          -d grant_type=password -d client_id=admin-cli -d username=admin \
          --data-urlencode "password=${admin_password}" | jq -r .access_token)"
        echo "::add-mask::${token}"
        api="${kc}/admin/realms/shop/clients"
        auth=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
        client="$(curl -fsS "${auth[@]}" "${api}?clientId=shop-frontend" | jq -c '.[0] // empty')"
        [[ -n "$client" ]] || { echo "::error::shop-frontend is missing from the shop realm"; exit 1; }
        updated="$(jq -c --argjson o "$origins" '
          ($o | map(. + "/*")) as $patterns
          | .redirectUris = ((.redirectUris // []) + ($patterns - (.redirectUris // [])))
          | .webOrigins = ((.webOrigins // []) + ($o - (.webOrigins // [])))
          | .attributes["post.logout.redirect.uris"] |= (
              ((. // "") | split("##") | map(select(. != ""))) as $have
              | $have + ($patterns - $have) | join("##"))' <<< "$client")"
        if [[ "$(jq -S . <<< "$updated")" == "$(jq -S . <<< "$client")" ]]; then
          echo "shop-frontend already accepts: ${ORIGINS}"
        else
          curl -fsS "${auth[@]}" -X PUT "${api}/$(jq -r .id <<< "$client")" -d "$updated" > /dev/null
          echo "shop-frontend now accepts: ${ORIGINS}"
        fi
