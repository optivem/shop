name: 'Run component-level test suites'
description: |
  Stage check: run a project's suites above unit, in pyramid order: narrow
  integration, component, provider verification (Pact) and, where the project
  has them, the external-system contract suites. Each suite's command comes
  from the project's component-tests.yaml through the gh-optivem CLI; a suite
  marked `pending` there is skipped by the CLI. Which suites run for which
  project is decided here.

  Shared by the `local` job in _prerelease-pipeline.yml and every
  *-commit-stage.yml, so both stages run the identical suites. Edit the list
  here, not in a caller.

  Requires: the compile action has run for the same project in this job,
  GH_OPTIVEM_CONFIG is set to a config that declares the project, and Docker
  is available (several suites use Testcontainers).

inputs:
  project:
    description: 'Project directory, e.g. system/monolith/java or system/multitier/backend-dotnet.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Component-level suites
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        case "$PROJECT" in
          system/monolith/java|system/monolith/dotnet|system/monolith/typescript)
            args=()
            suites=(integration component provider-verification) ;;
          system/multitier/backend-dotnet|system/multitier/backend-typescript)
            args=(--component backend)
            suites=(integration component provider-verification) ;;
          system/multitier/backend-java)
            # external-contract-real is the Real half of the stub parity pairs. It stays blocking
            # here, not in a later stage: it establishes that the stub is trustworthy enough for
            # the component suite to assert against. Testcontainers supplies the simulator on a
            # random port, so it needs no compose stack and no fixed port.
            args=(--component backend)
            suites=(integration component provider-verification external-contract external-contract-real) ;;
          system/multitier/frontend-react)
            # The frontend is the Pact consumer: it has no provider-verification suite.
            args=(--component frontend)
            suites=(integration component) ;;
          *)
            echo "::error::component: unknown project '$PROJECT'. Add it to .github/actions/component/action.yml."
            exit 1 ;;
        esac
        for suite in "${suites[@]}"; do
          echo "::group::component-test run ${args[*]} --suite $suite"
          gh optivem component-test run "${args[@]}" --suite "$suite"
          echo "::endgroup::"
        done
