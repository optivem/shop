name: monolith-dotnet-acceptance-stage-cloud

on:
  # Cron off to keep demo costs down; enable for a real application.
  # schedule:
  #   - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'Git SHA to test (leave empty for latest image)'
        required: false
        type: string

permissions: {}

concurrency:
  group: monolith-dotnet-acceptance-stage-cloud

jobs:
  acceptance-stage:
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/_acceptance-stage-cloud.yml
    secrets: inherit
    with:
      architecture: monolith
      language: dotnet
      images: '{"system":"monolith-system-dotnet"}'
      commit-sha: ${{ inputs.commit-sha }}
