# Commit stage for the clean-architecture backend variant.
#
# Deliberately much thinner than multitier-backend-java-commit-stage.yml: this variant is not
# deployed, not released and not system-tested, so there is no VERSION read, no Docker image build
# or push, no SonarCloud analysis, and no downstream pipeline trigger. It compiles, lints, and runs
# the unit, component, narrow-integration and contract suites — that is the whole gate.
#
# The variant is declared in gh-optivem-multitier-clean-java.yaml as `kind: component`, which is
# what gives it `gh optivem compile` and `gh optivem component-test` coverage without any system
# activation: the `system` and `system-test` verbs refuse a component config by name. The suites
# below are mirrored in system/multitier/backend-clean-java/component-tests.yaml, so
# `gh optivem component-test run --suite all` reproduces this gate locally.
#
# This workflow nevertheless still calls Gradle directly rather than going through the CLI. That is
# a deliberate current state, not an oversight: switching CI to invoke the CLI is a behaviour change
# with its own blast radius (CLI availability on the runner, exit-code and log-format differences,
# and the externalSimulatorImage ordering the real-mode contract step depends on). Keep the two in
# step by hand until that switch is made on its own terms.
name: multitier-backend-clean-java-commit-stage

on:
  push:
    branches: [ "main" ]
    paths:
        - 'system/multitier/backend-clean-java/**'
        - '.github/workflows/multitier-backend-clean-java-commit-stage.yml'
  pull_request:
    branches: [ "main" ]
    paths:
        - 'system/multitier/backend-clean-java/**'
        - '.github/workflows/multitier-backend-clean-java-commit-stage.yml'
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'Git SHA to build (leave empty for HEAD)'
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event_name }}-${{ inputs.commit-sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  COMMIT_SHA: ${{ inputs.commit-sha || github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The component suite pulls Postgres via Testcontainers; an authenticated Docker Hub pull
      # keeps it clear of the anonymous rate limit.
      - name: Ensure Environment Variables Defined
        uses: optivem/actions/validate-env-vars-defined@v1
        with:
          names: |
            DOCKERHUB_USERNAME
            DOCKERHUB_TOKEN
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  run:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: system/multitier/backend-clean-java
    steps:
      # === Checkout Code ===
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}
          fetch-depth: 0

      # === Compile Code ===
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Pre-warm Gradle Wrapper (retry transient CDN flakes)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: cd system/multitier/backend-clean-java && ./gradlew --version

      - name: Compile Code
        run: >-
          ./gradlew compileJava compileTestJava compileComponentTestJava
          compileContractTestJava compileIntegrationTestJava

      # === Run Test Pyramid ===
      - name: Log in to Docker Hub
        uses: optivem/actions/docker-login@v1
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Unit Tests
        run: ./gradlew test

      # Same 13 component-test classes as backend-java. Green here means the clean-architecture
      # implementation satisfies the identical behavioural spec — the reason this variant exists.
      - name: Run Component Tests
        run: ./gradlew componentTest --tests 'com.mycompany.myshop.backend.component.*'

      # Narrow integration: one adapter at a time. The persistence tests need the Testcontainers
      # Postgres; the gateway tests are in-process WireMock and need no container of their own.
      - name: Run Integration Tests
        run: ./gradlew integrationTest

      # Contract, in two halves because only the second needs the simulator image built:
      #   - provider verification (the frontend's pact from shop/contracts/) + the stub-side parity
      #     and stub-consumability suites, which run against WireMock;
      #   - the *RealParityContractTest classes, which run against the real external-system
      #     simulator and are what make the stubs above trustworthy.
      - name: Run Contract Tests
        run: >-
          ./gradlew contractTest
          --tests 'com.mycompany.myshop.backend.contract.internal.*'
          --tests 'com.mycompany.myshop.backend.contract.external.*.*Stub*'

      - name: Build External System Simulator Image
        run: ./gradlew externalSimulatorImage

      - name: Run Real-Mode Contract Tests
        run: ./gradlew contractTest --tests 'com.mycompany.myshop.backend.contract.external.*.*RealParity*'

      # === Run Linter ===
      - name: Run Linter
        run: ./gradlew checkstyleAll
