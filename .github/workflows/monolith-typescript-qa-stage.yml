name: monolith-typescript-qa-stage

# QA stage: deploys a release candidate created by the cloud acceptance stage
# (monolith-typescript-acceptance-stage.yml) to QA on Cloud Run and records the deployment to the
# monolith-typescript-qa environment, where monolith-typescript-qa-signoff.yml picks it up. To deploy with
# Docker Compose instead, see the commented block in _qa-stage.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version to deploy (e.g., monolith-typescript-v1.0.0-rc.1). Leave empty to deploy the latest available RC.'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: monolith-typescript-qa-stage

jobs:
  qa-stage:
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/_qa-stage.yml
    secrets: inherit
    with:
      architecture: monolith
      language: typescript
      test-language: typescript
      images: '{"system":"monolith-system-typescript"}'
      version: ${{ inputs.version }}
