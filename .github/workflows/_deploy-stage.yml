name: _deploy-stage

# QA / production deploy on Cloud Run: deploys a release candidate, then runs the smoke tests.
# Called by _qa-stage.yml and _prod-stage.yml, which own RC resolution and what happens after a
# green deploy; their callers own the dispatch trigger and concurrency (github.workflow resolves
# to the top-level caller, so a concurrency group here would deadlock).
#
# Everything per-variant comes from <architecture>-<language> and <stage>: the GitHub
# environment, and the service and database names. The realm comes from <stage> (see
# docker/keycloak/Dockerfile). Monolith deploys one system service, multitier a backend
# and a frontend, as in _acceptance-stage.yml.
#
# Two checkouts on purpose: the RC tag for the migrations, simulators and smoke tests, so a stage
# runs what the RC was tested with, and the workflow's own commit for Keycloak, shared by all
# (see build-shared-images).
#
# Cloud Run deploys straight from public GHCR: the RC's images by their RC tag, and the shared
# images from ghcr.io/<owner>/<repo>/shop-*, tagged by git tree hash (GHCR keeps them, so a
# production revision's images never expire).

on:
  workflow_call:
    inputs:
      stage:
        description: 'Stage: qa or production'
        required: true
        type: string
      architecture:
        description: 'Architecture: multitier or monolith'
        required: true
        type: string
      language:
        description: 'Language: java, dotnet, or typescript'
        required: true
        type: string
      test-language:
        description: 'Language of the smoke tests (java, dotnet, or typescript); empty means the same as language'
        required: false
        type: string
        default: ''
      images:
        description: 'JSON map of role to GHCR image name: {"frontend":"multitier-frontend-react","backend":"multitier-backend-java"} or {"system":"monolith-system-java"}'
        required: true
        type: string
      version:
        description: 'Release candidate: both the git tag and the GHCR image tag'
        required: true
        type: string

permissions: {}

env:
  # Prefix for Cloud Run services, secrets and databases; set by setup-gcp.sh from the repo name
  SYSTEM: ${{ vars.SYSTEM_NAME }}
  ARCHITECTURE: ${{ inputs.architecture }}
  STAGE: ${{ inputs.stage }}
  PREFIX: ${{ inputs.architecture }}-${{ inputs.language }}
  # Not VERSION: MSBuild reads env vars as properties, and $(Version) = an RC tag breaks the .NET
  # smoke harness's NuGet restore ("not a valid version string").
  RC_VERSION: ${{ inputs.version }}
  REALM: ${{ inputs.stage == 'production' && 'shop-prod' || 'shop-qa' }}
  TEST_LANGUAGE: ${{ inputs.test-language || inputs.language }}

jobs:
  # === Build Shared Images into GHCR ===
  shared-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.architecture }}-${{ inputs.language }}-${{ inputs.stage }}
    permissions:
      contents: read
    outputs:
      project-number: ${{ steps.project.outputs.project-number }}
      db-migrate-image: ${{ steps.shared.outputs.db-migrate }}
      keycloak-image: ${{ steps.shared.outputs.keycloak }}
      simulators-image: ${{ steps.shared.outputs.simulators }}
    steps:
      - name: Check Stage Is Supported
        run: |
          if [[ "$STAGE" != qa && "$STAGE" != production ]]; then
            echo "::error::Unknown stage '$STAGE'."
            exit 1
          fi
          if [[ "$ARCHITECTURE" != multitier && "$ARCHITECTURE" != monolith ]]; then
            echo "::error::Unknown architecture '$ARCHITECTURE'."
            exit 1
          fi
          if [[ "$TEST_LANGUAGE" != java && "$TEST_LANGUAGE" != dotnet && "$TEST_LANGUAGE" != typescript ]]; then
            echo "::error::Unknown test language '$TEST_LANGUAGE'."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Checkout Release Candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}
          path: source

      - name: Log in to GHCR
        uses: optivem/actions/docker-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve Project Number
        id: project
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          # The deployer SA has no resourcemanager.projects.get; the provider
          # name is projects/<number>/locations/global/..., so read it from there.
          PROJECT_NUMBER=$(cut -d/ -f2 <<< "$WIF_PROVIDER")
          [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Cannot parse project number from GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          echo "project-number=${PROJECT_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: List RC Images
        id: rc-images
        env:
          IMAGES: ${{ inputs.images }}
          BASE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          {
            echo 'refs<<EOF'
            jq -r --arg base "$BASE" --arg v "$RC_VERSION" '.[] | "\($base)/\(.):\($v)"' <<< "$IMAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Shared Images
        id: shared
        uses: ./.github/actions/build-shared-images
        with:
          registry: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          source-path: source
          public-images: ${{ steps.rc-images.outputs.refs }}

  # === Deploy: Keycloak (shared by all variants) ===
  deploy-keycloak:
    needs: shared-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.architecture }}-${{ inputs.language }}-${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Keycloak to Cloud Run
        uses: ./.github/actions/deploy-keycloak
        with:
          image: ${{ needs.shared-images.outputs.keycloak-image }}
          system: ${{ vars.SYSTEM_NAME }}
          project: ${{ vars.GCP_PROJECT_ID }}
          project-number: ${{ needs.shared-images.outputs.project-number }}
          region: ${{ vars.GCP_REGION }}
          reconcile-prod-realm: ${{ inputs.stage == 'production' }}

  # === Deploy: Stage Stack ===
  deploy-stack:
    needs: [shared-images, deploy-keycloak]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.architecture }}-${{ inputs.language }}-${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ needs.shared-images.outputs.project-number }}
      # The RC's images, straight from GHCR.
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
      BACKEND_IMAGE: ${{ fromJSON(inputs.images).backend }}
      FRONTEND_IMAGE: ${{ fromJSON(inputs.images).frontend }}
      SYSTEM_IMAGE: ${{ fromJSON(inputs.images).system }}
      MIGRATE_IMAGE: ${{ needs.shared-images.outputs.db-migrate-image }}
      SIM_IMAGE: ${{ needs.shared-images.outputs.simulators-image }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Service names are <system>-<architecture>-<language>-<stage>[-<role>]. They must stay as
      # they are: the Keycloak realms were imported with redirect URIs built from them
      # (docker/keycloak/stage-realm.jq), and an imported realm is never updated. Cloud Run caps
      # service names at 49 characters, so a long SYSTEM_NAME can push the longest ones
      # (multitier-typescript production) over; fail early with the name instead of mid-deploy.
      - name: Resolve Stack Settings
        run: |
          set -euo pipefail
          url() { echo "https://$1-${PROJECT_NUMBER}.${REGION}.run.app"; }
          p="${SYSTEM}-${PREFIX}-${STAGE}"
          if [[ "$ARCHITECTURE" == monolith ]]; then
            services=("${p}" "${p}-sim")
          else
            services=("${p}-backend" "${p}-frontend" "${p}-sim")
          fi
          for name in "${services[@]}"; do
            if (( ${#name} > 49 )); then
              echo "::error::Cloud Run service name '${name}' is ${#name} characters (max 49). Use a shorter SYSTEM_NAME (setup-gcp.sh)."
              exit 1
            fi
          done
          {
            echo "DB_NAME=${SYSTEM//-/_}_${PREFIX//-/_}_${STAGE}"
            echo "SA=runtime@${PROJECT}.iam.gserviceaccount.com"
            echo "SIM_NAME=${p}-sim"
            echo "MIGRATE_JOB=${p}-migrate"
            echo "SIM_URL=$(url "${p}-sim")"
            echo "KEYCLOAK_URL=$(url "${SYSTEM}-keycloak")"
            if [[ "$ARCHITECTURE" == monolith ]]; then
              echo "SYSTEM_SERVICE=${p}"
              echo "UI_HEALTH_URL=$(url "${p}")/health"
              echo "API_HEALTH_URL=$(url "${p}")/health"
            else
              echo "BACKEND_NAME=${p}-backend"
              echo "FRONTEND_NAME=${p}-frontend"
              echo "BACKEND_URL=$(url "${p}-backend")"
              echo "FRONTEND_URL=$(url "${p}-frontend")"
              echo "UI_HEALTH_URL=$(url "${p}-frontend")/"
              echo "API_HEALTH_URL=$(url "${p}-backend")/health"
            fi
          } >> "$GITHUB_ENV"

      - name: Deploy External Systems
        run: |
          set -euo pipefail
          gcloud run deploy "$SIM_NAME" \
            --image "$SIM_IMAGE" --region "$REGION" --project "$PROJECT" \
            --service-account "$SA" --port 9000 --memory 1Gi \
            --min-instances 0 --max-instances 2 --allow-unauthenticated

      - name: Read DB Credentials
        run: |
          set -euo pipefail
          db="$(gcloud secrets versions access latest --secret="${SYSTEM}-db")"
          password="$(jq -r .password <<< "$db")"
          echo "::add-mask::${password}"
          {
            echo "DB_HOST=$(jq -r .host <<< "$db")"
            echo "DB_PORT=$(jq -r .port <<< "$db")"
            echo "DB_USER=$(jq -r .user <<< "$db")"
            echo "DB_PASSWORD=${password}"
          } >> "$GITHUB_ENV"

      # Flyway reads its settings from FLYWAY_* env vars (avoids comma-splitting of --args).
      - name: Run DB Migrations
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/migrate-env.json"
          jq -n \
            --arg url "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
            --arg user "$DB_USER" --arg pass "$DB_PASSWORD" \
            '{FLYWAY_URL:$url, FLYWAY_USER:$user, FLYWAY_PASSWORD:$pass, FLYWAY_LOCATIONS:"filesystem:/flyway/sql"}' > "$env_file"
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --image "$MIGRATE_IMAGE" --region "$REGION" --project "$PROJECT" \
            --service-account "$SA" --args migrate --max-retries 0 --task-timeout 600 \
            --env-vars-file "$env_file"
          rm -f "$env_file"
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --project "$PROJECT" --wait

      # Monolith runs the OIDC login itself, so it has to see the https the browser used, or Keycloak
      # rejects the redirect URI: the two forwarded-header settings cover Java and .NET (TypeScript reads
      # x-forwarded-proto itself). One instance, because Java and .NET keep sessions and login state in memory.
      # Acceptance and QA realms carry the committed test secret. In production the shop-monolith secret
      # comes from Secret Manager (deploy-keycloak sets the same value in the shop-prod realm).
      - name: Deploy System
        if: inputs.architecture == 'monolith'
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/system-env.json"
          jq -n \
            --arg host "$DB_HOST" --arg port "$DB_PORT" --arg name "$DB_NAME" \
            --arg user "$DB_USER" --arg pass "$DB_PASSWORD" \
            --arg ext "$SIM_URL" --arg issuer "${KEYCLOAK_URL}/realms/${REALM}" --arg stage "$STAGE" \
            '{POSTGRES_DB_HOST:$host, POSTGRES_DB_PORT:$port, POSTGRES_DB_NAME:$name,
              POSTGRES_DB_USER:$user, POSTGRES_DB_PASSWORD:$pass, PGSSLMODE:"require",
              ERP_API_URL:($ext + "/erp"), CLOCK_API_URL:($ext + "/clock"), TAX_API_URL:($ext + "/tax"),
              EXTERNAL_SYSTEM_MODE:"real",
              AUTH_ISSUER_URI:$issuer,
              AUTH_TOKEN_URI:($issuer + "/protocol/openid-connect/token"),
              AUTH_JWK_SET_URI:($issuer + "/protocol/openid-connect/certs"),
              AUTH_AUDIENCE:"shop-backend",
              SERVER_FORWARDHEADERSSTRATEGY:"native", ASPNETCORE_FORWARDEDHEADERS_ENABLED:"true"}
             + (if $stage == "production" then {} else {AUTH_CLIENT_SECRET:"shop-monolith-test-secret"} end)' > "$env_file"
          secret_args=()
          if [[ "$STAGE" == production ]]; then
            secret_args=(--set-secrets "AUTH_CLIENT_SECRET=${SYSTEM}-monolith-client-secret:latest")
          fi
          gcloud run deploy "$SYSTEM_SERVICE" \
            --image "${IMAGE_BASE}/${SYSTEM_IMAGE}:${RC_VERSION}" --region "$REGION" --project "$PROJECT" \
            --service-account "$SA" --port 8080 --memory 1Gi --cpu 1 --cpu-boost \
            --min-instances 0 --max-instances 1 --allow-unauthenticated \
            --env-vars-file "$env_file" "${secret_args[@]}"
          rm -f "$env_file"

      # PGSSLMODE: Neon requires TLS. JDBC and Npgsql negotiate it, but node-postgres only uses it when told.
      - name: Deploy Backend
        if: inputs.architecture == 'multitier'
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/backend-env.json"
          jq -n \
            --arg host "$DB_HOST" --arg port "$DB_PORT" --arg name "$DB_NAME" \
            --arg user "$DB_USER" --arg pass "$DB_PASSWORD" \
            --arg ext "$SIM_URL" --arg origin "$FRONTEND_URL" \
            --arg issuer "${KEYCLOAK_URL}/realms/${REALM}" \
            '{POSTGRES_DB_HOST:$host, POSTGRES_DB_PORT:$port, POSTGRES_DB_NAME:$name,
              POSTGRES_DB_USER:$user, POSTGRES_DB_PASSWORD:$pass, PGSSLMODE:"require",
              ERP_API_URL:($ext + "/erp"), CLOCK_API_URL:($ext + "/clock"), TAX_API_URL:($ext + "/tax"),
              EXTERNAL_SYSTEM_MODE:"real", ALLOWED_ORIGINS:$origin,
              AUTH_ISSUER_URI:$issuer,
              AUTH_JWK_SET_URI:($issuer + "/protocol/openid-connect/certs"),
              AUTH_AUDIENCE:"shop-backend"}' > "$env_file"
          gcloud run deploy "$BACKEND_NAME" \
            --image "${IMAGE_BASE}/${BACKEND_IMAGE}:${RC_VERSION}" --region "$REGION" --project "$PROJECT" \
            --service-account "$SA" --port 8081 --memory 1Gi --cpu 1 --cpu-boost \
            --min-instances 0 --max-instances 2 --allow-unauthenticated \
            --env-vars-file "$env_file"
          rm -f "$env_file"

      - name: Deploy Frontend
        if: inputs.architecture == 'multitier'
        run: |
          set -euo pipefail
          gcloud run deploy "$FRONTEND_NAME" \
            --image "${IMAGE_BASE}/${FRONTEND_IMAGE}:${RC_VERSION}" --region "$REGION" --project "$PROJECT" \
            --service-account "$SA" --port 3000 \
            --min-instances 0 --max-instances 2 --allow-unauthenticated \
            --set-env-vars "BACKEND_API_URL=${BACKEND_URL},KEYCLOAK_URL=${KEYCLOAK_URL},KEYCLOAK_REALM=${REALM},KEYCLOAK_CLIENT_ID=shop-frontend"

      - name: Wait for Systems
        uses: optivem/actions/wait-for-endpoints@v1
        with:
          endpoints: |
            [
              { "name": "MyShop UI", "url": "${{ env.UI_HEALTH_URL }}" },
              { "name": "MyShop API", "url": "${{ env.API_HEALTH_URL }}" },
              { "name": "ERP", "url": "${{ env.SIM_URL }}/erp/health" },
              { "name": "Clock", "url": "${{ env.SIM_URL }}/clock/health" }
            ]
          max-attempts: '60'
          wait-seconds: '10'
          timeout-seconds: '900'

  # === Run Smoke Tests (in the test language): they need no login, so they work on every stage ===
  # They run anonymously on purpose. The test harnesses only request tokens from the test realm
  # (`shop`), whose tokens a QA/production backend (realm shop-qa/shop-prod) rejects with 401,
  # so KEYCLOAK_URL[_REAL] must stay unset here (see the systems.yaml step).
  smoke:
    needs: [shared-images, deploy-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.architecture }}-${{ inputs.language }}-${{ inputs.stage }}
    permissions:
      contents: read
      packages: read
    env:
      GH_OPTIVEM_CONFIG: gh-optivem-${{ inputs.architecture }}-${{ inputs.test-language || inputs.language }}.yaml
      # Selects the acceptance environment in every test harness; every URL in it is overridden below.
      ENVIRONMENT: acceptance
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_NUMBER: ${{ needs.shared-images.outputs.project-number }}
    steps:
      - name: Resolve System URLs
        run: |
          set -euo pipefail
          url() { echo "https://$1-${PROJECT_NUMBER}.${REGION}.run.app"; }
          p="${SYSTEM}-${PREFIX}-${STAGE}"
          if [[ "$ARCHITECTURE" == monolith ]]; then
            ui="$(url "${p}")"; api="$ui"
          else
            ui="$(url "${p}-frontend")"; api="$(url "${p}-backend")"
          fi
          {
            echo "MYSHOP_UI_BASE_URL_REAL=${ui}"
            echo "MYSHOP_API_BASE_URL_REAL=${api}"
            echo "ERP_API_BASE_URL_REAL=$(url "${p}-sim")/erp"
            echo "CLOCK_API_BASE_URL_REAL=$(url "${p}-sim")/clock"
            echo "TAX_API_BASE_URL_REAL=$(url "${p}-sim")/tax"
            echo "KEYCLOAK_BASE_URL=$(url "${SYSTEM}-keycloak")"
          } >> "$GITHUB_ENV"

      - name: Checkout Release Candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      - name: Log in to GHCR
        uses: optivem/actions/docker-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Java
        if: env.TEST_LANGUAGE == 'java'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        if: env.TEST_LANGUAGE == 'java'
        uses: gradle/actions/setup-gradle@v6

      - name: Pre-warm Gradle Wrapper (retry transient CDN flakes)
        if: env.TEST_LANGUAGE == 'java'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: cd system-test/java && ./gradlew --version

      - name: Setup .NET
        if: env.TEST_LANGUAGE == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet Packages
        if: env.TEST_LANGUAGE == 'dotnet'
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('system-test/dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Node
        if: env.TEST_LANGUAGE == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: system-test/typescript/package-lock.json

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ (env.TEST_LANGUAGE == 'java' && hashFiles('system-test/java/build.gradle')) || (env.TEST_LANGUAGE == 'dotnet' && hashFiles('system-test/dotnet/**/*.csproj')) || hashFiles('system-test/typescript/package-lock.json') }}

      - name: Compile System Tests
        # .NET-only pre-build: Java/TS pre-build implicitly via setupCommands.
        # Required here so playwright.ps1 (in build output) exists for the
        # suite's testInstallCommand to invoke.
        if: env.TEST_LANGUAGE == 'dotnet'
        run: dotnet build
        working-directory: system-test/dotnet

      - name: Install gh-optivem CLI extension
        uses: optivem/actions/install-gh-optivem@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The stack is already deployed by earlier jobs, so no `gh optivem system start`.
      - name: Setup Test Harness
        run: gh optivem system-test setup

      # `system-test run` health-probes systems.yaml, so the checkout's copy must name the
      # deployed stack, not localhost. composeFile is required by the loader but unused.
      # The realm is not named "Keycloak": `system-test run` exports KEYCLOAK_URL_<LABEL> for a
      # component of that name, which would switch the harness to token acquisition.
      - name: Point systems.yaml at the Deployed Stack
        run: |
          set -euo pipefail
          ui_name=Frontend api_name="Backend API" ui_health=""
          if [[ "$ARCHITECTURE" == monolith ]]; then
            ui_name=Monolith api_name="Monolith API"
            ui_health=$'\n'"        healthUrl: ${MYSHOP_UI_BASE_URL_REAL}/health"
          fi
          cat > "docker/${TEST_LANGUAGE}/${ARCHITECTURE}/systems.yaml" <<EOF
          systems:
            - label: real
              composeFile: docker-compose.local.real.yml
              containerName: cloud-real
              components:
                - name: ${ui_name}
                  url: ${MYSHOP_UI_BASE_URL_REAL}${ui_health}
                - name: ${api_name}
                  url: ${MYSHOP_API_BASE_URL_REAL}/health
                - name: Keycloak Realm
                  url: ${KEYCLOAK_BASE_URL}/realms/${REALM}
              externalSystems:
                - name: ERP API
                  url: ${ERP_API_BASE_URL_REAL}/health
                - name: Clock API
                  url: ${CLOCK_API_BASE_URL_REAL}/health
          EOF

      - name: smoke-real
        run: gh optivem system-test run --suite smoke-real
