name: _prerelease-pipeline

on:
  workflow_call:
    inputs:
      prefix:
        description: 'Pipeline prefix (e.g. monolith-java, multitier-dotnet)'
        required: true
        type: string
      architecture:
        description: 'Architecture: monolith or multitier'
        required: true
        type: string
      language:
        description: 'Language: java, dotnet, or typescript'
        required: true
        type: string
      commit-workflows:
        description: 'JSON array of commit-stage workflow filenames'
        required: false
        type: string
        default: '[]'
      skip-local-stage:
        description: 'Skip local stage (when local stages are run externally)'
        required: false
        type: boolean
        default: false
      skip-commit-stage:
        description: 'Skip commit stage (when commit stages are run externally)'
        required: false
        type: boolean
        default: false
      skip-acceptance-legacy:
        description: 'Skip the legacy sample in the local stage and the acceptance-stage-legacy job'
        required: false
        type: boolean
        default: false
      level:
        # acceptance stops at the free Docker Compose gates and creates no RC. qa adds the cloud
        # chain: cloud acceptance (creates the RC), QA stage and QA sign-off. meta-prerelease-stage
        # passes acceptance on its daily runs and qa on the weekly heartbeat and manual dispatch.
        description: 'Verification level: local, commit, acceptance (Docker gates only), or qa (adds cloud acceptance, QA stage and QA sign-off)'
        required: false
        type: string
        default: 'qa'
      commit-sha:
        description: 'Git SHA to pin the pipeline to (leave empty for HEAD)'
        required: false
        type: string
        default: ''

permissions: {}

# Concurrency is set on callers; declaring it here would collide and deadlock (github.workflow resolves to the caller).

env:
  COMMIT_SHA: ${{ inputs.commit-sha || github.sha }}

jobs:
  # Early fail-fast: catch the case where <prefix>-v<VERSION> has been tagged
  # since the meta check-version ran (TOCTOU), or when this pipeline is
  # triggered directly outside of meta. Without this, a released version
  # only gets detected ~20 min later at acceptance-stage.
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base-version: ${{ steps.read-base-version.outputs.base-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.COMMIT_SHA }}

      - name: Read Base Version
        id: read-base-version
        uses: optivem/actions/read-base-version@v1
        with:
          file: system/${{ inputs.architecture }}/${{ inputs.language }}/VERSION

      - name: Check Version Already Released
        id: check-release-tag
        uses: optivem/actions/check-tag-exists@v1
        with:
          tag: ${{ inputs.prefix }}-v${{ steps.read-base-version.outputs.base-version }}

      - name: Ensure Version Unreleased
        if: steps.check-release-tag.outputs.exists == 'true'
        shell: bash
        env:
          TAG: ${{ inputs.prefix }}-v${{ steps.read-base-version.outputs.base-version }}
        run: |
          echo "::error::Version $TAG is already released. Bump the VERSION file and create a new RC."
          exit 1

  local:
    needs: check-version
    if: ${{ !inputs.skip-local-stage && needs.check-version.result == 'success' }}
    runs-on: ubuntu-latest
    # A hung suite must fail fast instead of burning GitHub's 6h job limit.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_OPTIVEM_CONFIG: gh-optivem-${{ inputs.architecture }}-${{ inputs.language }}.yaml
      # Enables token acquisition in the system tests (opt-in; ports are per-language).
      KEYCLOAK_URL_REAL: ${{ (inputs.language == 'java' && 'http://localhost:8191') || (inputs.language == 'dotnet' && 'http://localhost:8291') || 'http://localhost:8391' }}
      KEYCLOAK_URL_STUB: ${{ (inputs.language == 'java' && 'http://localhost:8192') || (inputs.language == 'dotnet' && 'http://localhost:8292') || 'http://localhost:8392' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      # Setup runtimes
      - name: Setup Node.js
        if: inputs.language == 'typescript' || inputs.architecture == 'multitier'
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            system/monolith/typescript/package-lock.json
            system/multitier/backend-typescript/package-lock.json
            system/multitier/frontend-react/package-lock.json
            system-test/typescript/package-lock.json

      - name: Setup Java
        if: inputs.language == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: inputs.language == 'java'
        uses: gradle/actions/setup-gradle@v6

      - name: Setup .NET
        if: inputs.language == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Install the gh-optivem CLI extension. The extension provides the
      # `gh optivem component-test`, `gh optivem system start` and
      # `gh optivem system-test run` subcommands used by the stage-check actions
      # below and to bring up the docker-compose stacks and run the test suites.
      - name: Install gh-optivem CLI extension
        uses: optivem/actions/install-gh-optivem@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # === Commit-stage checks: compile, lint, unit, component ===
      # The same .github/actions/<concern> actions every *-commit-stage.yml calls,
      # with the same project selector, so a green local runs exactly the commit
      # stage's gates and cannot drift from them. Run before `system start` so they
      # fail fast and the component suites never collide on ports with the
      # real+stub stack. Uses the job-level GH_OPTIVEM_CONFIG.
      - name: Compile (monolith)
        if: inputs.architecture == 'monolith'
        uses: ./.github/actions/compile
        with:
          project: system/monolith/${{ inputs.language }}

      - name: Compile (multitier backend)
        if: inputs.architecture == 'multitier'
        uses: ./.github/actions/compile
        with:
          project: system/multitier/backend-${{ inputs.language }}

      # The frontend runs in every multitier config (OQ-2b: true superset).
      - name: Compile (multitier frontend)
        if: inputs.architecture == 'multitier'
        uses: ./.github/actions/compile
        with:
          project: system/multitier/frontend-react

      # Local-only extra: the production bundle. The frontend commit stage builds
      # it inside the Docker image, which local does not build.
      - name: Build Frontend Bundle (multitier)
        if: inputs.architecture == 'multitier'
        run: npm run build
        working-directory: system/multitier/frontend-react

      # Compile system tests (local-only: no commit stage builds them).
      - name: Compile System Tests (typescript)
        if: inputs.language == 'typescript'
        run: npm ci && npx tsc --noEmit
        working-directory: system-test/typescript

      - name: Compile System Tests (java)
        if: inputs.language == 'java'
        run: ./gradlew compileJava compileTestJava
        working-directory: system-test/java

      - name: Compile System Tests (dotnet)
        if: inputs.language == 'dotnet'
        run: dotnet build
        working-directory: system-test/dotnet

      - name: Run Linter (monolith)
        if: inputs.architecture == 'monolith'
        uses: ./.github/actions/lint
        with:
          project: system/monolith/${{ inputs.language }}

      - name: Run Linter (multitier backend)
        if: inputs.architecture == 'multitier'
        uses: ./.github/actions/lint
        with:
          project: system/multitier/backend-${{ inputs.language }}

      # The frontend runs in every multitier config (OQ-2b: true superset).
      - name: Run Linter (multitier frontend)
        if: inputs.architecture == 'multitier'
        uses: ./.github/actions/lint
        with:
          project: system/multitier/frontend-react

      - name: Run Unit Tests (monolith)
        if: inputs.architecture == 'monolith'
        uses: ./.github/actions/unit
        with:
          project: system/monolith/${{ inputs.language }}

      - name: Run Unit Tests (multitier backend)
        if: inputs.architecture == 'multitier'
        uses: ./.github/actions/unit
        with:
          project: system/multitier/backend-${{ inputs.language }}

      # The frontend runs in every multitier config (OQ-2b: true superset).
      - name: Run Unit Tests (multitier frontend)
        if: inputs.architecture == 'multitier'
        uses: ./.github/actions/unit
        with:
          project: system/multitier/frontend-react

      - name: Run Component-Level Suites (monolith)
        if: inputs.architecture == 'monolith'
        uses: ./.github/actions/component
        with:
          project: system/monolith/${{ inputs.language }}

      - name: Run Component-Level Suites (multitier backend)
        if: inputs.architecture == 'multitier'
        uses: ./.github/actions/component
        with:
          project: system/multitier/backend-${{ inputs.language }}

      # The frontend runs in every multitier config (OQ-2b: true superset).
      - name: Run Component-Level Suites (multitier frontend)
        if: inputs.architecture == 'multitier'
        uses: ./.github/actions/component
        with:
          project: system/multitier/frontend-react

      # Bring up the docker-compose stacks (real + stub) and wait for health.
      - name: Start system
        run: gh optivem system start

      # Diagnostic: `gh optivem system start` only surfaces compose's
      # "container X exited (1)" and swallows the container's own stderr, so a
      # crash-on-boot is undebuggable from the run logs. On any failure of this
      # job, dump every container's state + logs so the real error is visible.
      # (Aligns with the repo rule: never swallow stderr from external commands.)
      - name: Dump container logs (on failure)
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a
          for c in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's#^/##')
            echo "::group::logs: $name (exit=$(docker inspect --format '{{.State.ExitCode}}' "$c"))"
            docker logs "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Setup test harness (latest)
        run: gh optivem system-test setup

      - name: Run System Tests - Latest (Sample)
        run: gh optivem system-test run --sample

      - name: Setup test harness (legacy)
        if: ${{ !inputs.skip-acceptance-legacy }}
        env:
          GH_OPTIVEM_CONFIG: gh-optivem-${{ inputs.architecture }}-${{ inputs.language }}-legacy.yaml
        run: gh optivem system-test setup

      - name: Run System Tests - Legacy (Sample)
        if: ${{ !inputs.skip-acceptance-legacy }}
        env:
          GH_OPTIVEM_CONFIG: gh-optivem-${{ inputs.architecture }}-${{ inputs.language }}-legacy.yaml
        run: gh optivem system-test run --sample

  commit-stage:
    needs: [check-version, local]
    if: ${{ always() && inputs.level != 'local' && !inputs.skip-commit-stage && needs.check-version.result == 'success' && (inputs.skip-local-stage || needs.local.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        workflow: ${{ fromJSON(inputs.commit-workflows) }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: optivem/actions/trigger-and-wait-for-workflow@v1
        with:
          workflow: ${{ matrix.workflow }}
          workflow-inputs: '{"commit-sha": "${{ inputs.commit-sha }}"}'

  # The Docker Compose gates: they tag nothing. The RC comes from the cloud acceptance stage
  # (<prefix>-acceptance-stage.yml, the cloud-acceptance-stage job below at level qa, or a
  # manual dispatch); it also checks that the tested SHA carries the RC tag.
  acceptance-stage:
    needs: [check-version, local, commit-stage]
    if: ${{ always() && inputs.level != 'local' && inputs.level != 'commit' && needs.check-version.result == 'success' && (inputs.skip-local-stage || needs.local.result == 'success') && (inputs.skip-commit-stage || needs.commit-stage.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: optivem/actions/trigger-and-wait-for-workflow@v1
        with:
          workflow: ${{ inputs.prefix }}-acceptance-stage-docker-compose.yml
          poll-interval: '180'
          timeout-seconds: '7200'
          workflow-inputs: '{"commit-sha": "${{ inputs.commit-sha }}"}'

  # Parallel with acceptance-stage. A project that drops legacy deletes this job and its
  # <prefix>-acceptance-stage-docker-compose-legacy.yml caller.
  acceptance-stage-legacy:
    needs: [check-version, local, commit-stage]
    if: ${{ always() && inputs.level != 'local' && inputs.level != 'commit' && !inputs.skip-acceptance-legacy && needs.check-version.result == 'success' && (inputs.skip-local-stage || needs.local.result == 'success') && (inputs.skip-commit-stage || needs.commit-stage.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: optivem/actions/trigger-and-wait-for-workflow@v1
        with:
          workflow: ${{ inputs.prefix }}-acceptance-stage-docker-compose-legacy.yml
          poll-interval: '180'
          timeout-seconds: '7200'
          workflow-inputs: '{"commit-sha": "${{ inputs.commit-sha }}"}'

  # === Cloud chain (level qa only) ===
  # Cost control: meta-prerelease-stage runs level qa only on its weekly heartbeat and on
  # manual dispatch; its daily runs use level acceptance and stop at the Docker Compose gates
  # above. The chain runs on a commit that passed both gates and ends with a qa/signoff=success
  # commit status on the RC, which meta-prerelease-stage's tag-meta-rc manifest requires.
  cloud-acceptance-stage:
    needs: [check-version, acceptance-stage, acceptance-stage-legacy]
    if: ${{ always() && inputs.level == 'qa' && needs.check-version.result == 'success' && needs.acceptance-stage.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.acceptance-stage-legacy.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      rc: ${{ steps.rc.outputs.tag }}
    steps:
      # An explicit commit-sha bypasses the stage's "no new artifacts" skip gate, so it always
      # runs and leaves an RC tag on this SHA.
      - uses: optivem/actions/trigger-and-wait-for-workflow@v1
        with:
          workflow: ${{ inputs.prefix }}-acceptance-stage.yml
          poll-interval: '180'
          timeout-seconds: '7200'
          workflow-inputs: '{"commit-sha": "${{ env.COMMIT_SHA }}"}'

      - name: Resolve RC Tag On SHA
        id: rc
        uses: optivem/actions/resolve-latest-tag-from-sha@v1
        with:
          commit-sha: ${{ env.COMMIT_SHA }}
          pattern: ${{ inputs.prefix }}-v${{ needs.check-version.outputs.base-version }}-rc.*

      - name: Fail If No RC Tag On SHA
        if: steps.rc.outputs.tag == ''
        shell: bash
        env:
          PATTERN: ${{ inputs.prefix }}-v${{ needs.check-version.outputs.base-version }}-rc.*
        run: |
          echo "::error::Cloud acceptance finished but no rc tag matching '$PATTERN' is on $COMMIT_SHA."
          exit 1

  qa-stage:
    needs: cloud-acceptance-stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: optivem/actions/trigger-and-wait-for-workflow@v1
        with:
          workflow: ${{ inputs.prefix }}-qa-stage.yml
          poll-interval: '120'
          timeout-seconds: '5400'
          workflow-inputs: '{"version": "${{ needs.cloud-acceptance-stage.outputs.rc }}"}'

  # Automated sign-off: the QA stage's deploy and tests passing is the approval. A human can
  # still reject an RC afterwards by dispatching <prefix>-qa-signoff.yml with result=rejected.
  qa-signoff:
    needs: [cloud-acceptance-stage, qa-stage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: optivem/actions/trigger-and-wait-for-workflow@v1
        with:
          workflow: ${{ inputs.prefix }}-qa-signoff.yml
          workflow-inputs: '{"version": "${{ needs.cloud-acceptance-stage.outputs.rc }}", "result": "approved"}'

  #
  # Note: prod-stage is intentionally NOT part of the pipeline.
  # Production releases are orchestrated externally via meta-release-stage (for full releases)
  # or via direct workflow_dispatch on the per-flavor *-prod-stage.yml workflows.
  # Keeping the release step out of the pipeline enforces the rule that
  # "verification" and "release" are separate concerns.
