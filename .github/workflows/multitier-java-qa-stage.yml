name: multitier-java-qa-stage

# QA stage: deploys a release candidate created by the cloud acceptance stage
# (multitier-java-acceptance-stage.yml) to QA on Cloud Run and records the deployment to the
# multitier-java-qa environment, where multitier-java-qa-signoff.yml picks it up. To deploy with
# Docker Compose instead, see the commented block in _qa-stage.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version to deploy (e.g., multitier-java-v1.0.0-rc.1). Leave empty to deploy the latest available RC.'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: multitier-java-qa-stage

jobs:
  qa-stage:
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/_qa-stage.yml
    secrets: inherit
    with:
      architecture: multitier
      language: java
      test-language: java
      images: '{"frontend":"multitier-frontend-react","backend":"multitier-backend-java"}'
      version: ${{ inputs.version }}
