name: monolith-typescript-acceptance-stage

run-name: >-
  monolith-typescript-acceptance-stage${{ inputs.commit-sha && format(' [sha:{0}]', inputs.commit-sha) || ' [latest-image]' }}

# Cloud acceptance stage: the real acceptance stage, in a production-like environment (Cloud Run).
# It owns the release candidate (monolith-typescript-v<x.y.z>-rc.N) that QA consumes. Dispatch it
# manually on a commit that passed the Docker Compose gates
# (monolith-typescript-acceptance-stage-docker-compose[-legacy].yml).

on:
  # Manual only, to keep cloud costs at zero; uncomment to run it automatically.
  # schedule:
  #   - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'Git SHA to test (leave empty for latest image)'
        required: false
        type: string

permissions: {}

concurrency:
  group: monolith-typescript-acceptance-stage

jobs:
  acceptance-stage:
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/_acceptance-stage.yml
    secrets: inherit
    with:
      architecture: monolith
      language: typescript
      test-language: typescript
      images: '{"system":"monolith-system-typescript"}'
      commit-sha: ${{ inputs.commit-sha }}
