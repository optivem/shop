name: multitier-java-qa-stage-cloud

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version to deploy (e.g., multitier-java-cloud-v1.0.0-rc.1). Leave empty to deploy the latest available RC.'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: multitier-java-qa-stage-cloud

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ inputs.version || steps.resolve-latest.outputs.tag }}
      image-urls: ${{ steps.resolve-images.outputs.image-urls }}
    steps:
      - name: Ensure Environment Variables Defined
        uses: optivem/actions/validate-env-vars-defined@v1
        with:
          names: |
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
            SYSTEM_NAME
            GHCR_TOKEN
            WORKFLOW_TOKEN
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SYSTEM_NAME: ${{ vars.SYSTEM_NAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Resolve Latest RC
        id: resolve-latest
        if: inputs.version == ''
        uses: optivem/actions/resolve-latest-prerelease-tag@v1
        with:
          tag-prefix: multitier-java-cloud-v

      - name: Check RC Exists
        if: inputs.version != ''
        uses: optivem/actions/validate-tag-exists@v1
        with:
          tag: ${{ inputs.version }}

      - name: Compose Docker Image URLs
        id: resolve-images
        uses: optivem/actions/compose-docker-image-urls@v1
        with:
          tag: ${{ inputs.version || steps.resolve-latest.outputs.tag }}
          base-image-urls: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/multitier-frontend-react
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/multitier-backend-java

  deploy:
    needs: check
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/_deploy-stage-cloud.yml
    secrets: inherit
    with:
      stage: qa
      architecture: multitier
      language: java
      images: '{"frontend":"multitier-frontend-react","backend":"multitier-backend-java"}'
      version: ${{ needs.check.outputs.version }}

  promote:
    needs: [check, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ needs.check.outputs.version }}
      image-urls: ${{ needs.check.outputs.image-urls }}
    steps:
      - name: Record QA Deployment
        uses: optivem/actions/create-deployment@v1
        with:
          ref: ${{ needs.check.outputs.version }}
          environment: multitier-java-qa-cloud
          token: ${{ secrets.WORKFLOW_TOKEN }}

  summary:
    needs: [check, deploy, promote]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Summarize Stage
      uses: optivem/actions/render-system-stage-summary@v1
      with:
        stage-name: 'QA Stage (Cloud Run)'
        stage-result: ${{ (needs.check.result == 'failure' || needs.deploy.result == 'failure') && 'failure' || needs.promote.result }}
        environment: qa
        success-version: ${{ needs.promote.outputs.version }}
        success-artifact-ids: ${{ needs.promote.outputs.image-urls }}
