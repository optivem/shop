name: monolith-typescript-acceptance-stage-docker-compose

run-name: >-
  monolith-typescript-acceptance-stage-docker-compose${{ inputs.commit-sha && format(' [sha:{0}]', inputs.commit-sha) || ' [latest-image]' }}

# Docker Compose acceptance gate, latest suites. Runs on every prerelease pipeline run against
# the commit-stage images on the runner. Gate only: it creates no RC tag (the cloud
# monolith-typescript-acceptance-stage.yml does).

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'Git SHA to test (leave empty for latest image)'
        required: false
        type: string

permissions: {}

concurrency:
  group: monolith-typescript-acceptance-stage-docker-compose

jobs:
  acceptance-stage:
    permissions:
      actions: write
      contents: read
      packages: read
    uses: ./.github/workflows/_acceptance-stage-docker-compose.yml
    secrets: inherit
    with:
      architecture: monolith
      language: typescript
      test-language: typescript
      images: '{"system":"monolith-system-typescript"}'
      commit-sha: ${{ inputs.commit-sha }}
      suite-set: latest
