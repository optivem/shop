name: monolith-java-acceptance-stage-docker-compose-legacy

run-name: >-
  monolith-java-acceptance-stage-docker-compose-legacy${{ inputs.commit-sha && format(' [sha:{0}]', inputs.commit-sha) || ' [latest-image]' }}

# Docker Compose acceptance gate, legacy suites. Dispatched by the prerelease pipeline (no cron).
# Gate only: no RC tag. Legacy never runs on cloud. A project that drops legacy deletes this file
# and the acceptance-stage-legacy job from its prerelease pipeline.

on:
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'Git SHA to test (leave empty for latest image)'
        required: false
        type: string

permissions: {}

concurrency:
  group: monolith-java-acceptance-stage-docker-compose-legacy

jobs:
  acceptance-stage:
    permissions:
      actions: write
      contents: read
      packages: read
    uses: ./.github/workflows/_acceptance-stage-docker-compose.yml
    secrets: inherit
    with:
      architecture: monolith
      language: java
      test-language: java
      images: '{"system":"monolith-system-java"}'
      commit-sha: ${{ inputs.commit-sha }}
      suite-set: legacy
