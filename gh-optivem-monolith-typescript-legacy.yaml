project:
    provider: github
    url: https://github.com/orgs/optivem/projects/20
repo-strategy: mono-repo
channels: [api, ui]
sonar:
    organization: optivem
system:
    architecture: monolith
    config: docker/typescript/monolith/systems.yaml
    path: system/monolith/typescript
    repo: optivem/shop
    lang: typescript
    sonar-project: optivem_shop-monolith-typescript
    db-migration-path: system/db/migrations
system-test:
    path: system-test/typescript
    config: system-test/typescript/tests.legacy.yaml
    repo: optivem/shop
    lang: typescript
    sonar-project: optivem_shop-tests-typescript
    paths:
        system-driver-port: system-test/typescript/src/testkit/driver/port
        system-driver-adapter: system-test/typescript/src/testkit/driver/adapter
        system-driver-adapter-shared: system-test/typescript/src/testkit/driver/adapter/shared
        common: system-test/typescript/src/testkit/common
        common-domain: system-test/typescript/src/testkit/common/domain
        external-system-driver-port: system-test/typescript/src/testkit/driver/port/external
        external-system-driver-adapter: system-test/typescript/src/testkit/driver/adapter/external
        at-test: system-test/typescript/tests/latest/acceptance
        dsl-port: system-test/typescript/src/testkit/dsl/port
        dsl-core: system-test/typescript/src/testkit/dsl/core/usecase
        ct-test: system-test/typescript/tests/latest/contract
    system-driver-adapter-channels:
        api: system-test/typescript/src/testkit/driver/adapter/api
        ui: system-test/typescript/src/testkit/driver/adapter/ui
external-systems:
    clock:
        real-kind: simulator
        stub:
            path: external-systems/stubs
            repo: optivem/shop
        simulator:
            path: external-systems/simulators
            repo: optivem/shop
    erp:
        real-kind: simulator
        stub:
            path: external-systems/stubs
            repo: optivem/shop
        simulator:
            path: external-systems/simulators
            repo: optivem/shop
    tax:
        real-kind: simulator
        stub:
            path: external-systems/stubs
            repo: optivem/shop
        simulator:
            path: external-systems/simulators
            repo: optivem/shop
