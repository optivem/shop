name: my-shop-stub

services:

  system:
    # Per-language tag: the project name above is shared by every language, so the default image name would be too.
    image: my-shop-java-monolith-system:local
    build:
      context: ../../../system/monolith/java
      dockerfile: Dockerfile
    ports:
      - "3112:8080"
      - "8112:8080"
    environment:
      - POSTGRES_DB_HOST=postgres
      - POSTGRES_DB_PORT=5432
      - POSTGRES_DB_NAME=app
      - POSTGRES_DB_USER=app
      - POSTGRES_DB_PASSWORD=app
      - ERP_API_URL=http://external-system-stubs:8080/erp
      # Stub only: a short breaker open time, and a breaker that opens only when every recent ERP call failed, so an
      # ERP-outage test doesn't leak 503s into the next test. At the default 50%, the outage's failed calls left in the
      # count-based window (or the last one in a half-open trial) reopen the breaker on the next test's first good calls.
      - RESILIENCE_CIRCUITBREAKER_WAITINOPENSTATE=100ms
      - RESILIENCE_CIRCUITBREAKER_FAILURERATETHRESHOLD=100
      - CLOCK_API_URL=http://external-system-stubs:8080/clock
      - TAX_API_URL=http://external-system-stubs:8080/tax
      - EXTERNAL_SYSTEM_MODE=stub
      - AUTH_ISSUER_URI=http://localhost:8192/realms/shop
      - AUTH_TOKEN_URI=http://keycloak:8080/realms/shop/protocol/openid-connect/token
      - AUTH_JWK_SET_URI=http://keycloak:8080/realms/shop/protocol/openid-connect/certs
      - AUTH_AUDIENCE=shop-backend
      - AUTH_CLIENT_SECRET=shop-monolith-test-secret
      - OTEL_SERVICE_NAME=shop-java-monolith
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      external-system-stubs:
        condition: service_started
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://localhost:8192
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    ports:
      - "8192:8080"
    volumes:
      - ../../keycloak/shop-realm.json:/opt/keycloak/data/import/shop-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app-network

  db-migrate:
    image: flyway/flyway:10.21.0-alpine
    command: -url=jdbc:postgresql://postgres:5432/app -user=app -password=app -locations=filesystem:/migrations migrate
    environment:
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ../../../system/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  external-system-stubs:
    image: wiremock/wiremock:3.10.0
    ports:
      - "9112:8080"
    volumes:
      - ../../../external-systems/stubs:/home/wiremock
    command: --verbose --global-response-templating
    networks:
      - app-network

  # Opt-in observability backend (OpenTelemetry -> Grafana LGTM: Tempo traces,
  # Loki logs, Prometheus metrics). Off unless `--profile observability` is
  # passed, so the default stack is unchanged. See docs/observability.md.
  # Kept byte-identical across all 24 compose files (checked by compose-drift.yml).
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.7
    profiles: [observability]
    ports:
      - "3900:3000"
      - "4317:4317"
      - "4318:4318"
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
