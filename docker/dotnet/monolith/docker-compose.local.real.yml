name: my-shop-real

services:

  system:
    build:
      context: ../../../system/monolith/dotnet
      dockerfile: Dockerfile
    ports:
      - "3211:8080"
      - "8211:8080"
    environment:
      - POSTGRES_DB_HOST=postgres
      - POSTGRES_DB_PORT=5432
      - POSTGRES_DB_NAME=app
      - POSTGRES_DB_USER=app
      - POSTGRES_DB_PASSWORD=app
      - ERP_API_URL=http://external-system-simulators:9000/erp
      - CLOCK_API_URL=http://external-system-simulators:9000/clock
      - TAX_API_URL=http://external-system-simulators:9000/tax
      - EXTERNAL_SYSTEM_MODE=real
      - AUTH_ISSUER_URI=http://localhost:8291/realms/shop
      - AUTH_TOKEN_URI=http://keycloak:8080/realms/shop/protocol/openid-connect/token
      - AUTH_JWK_SET_URI=http://keycloak:8080/realms/shop/protocol/openid-connect/certs
      - AUTH_AUDIENCE=shop-backend
      - AUTH_CLIENT_SECRET=shop-monolith-test-secret
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      external-system-simulators:
        condition: service_healthy
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://localhost:8291
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    ports:
      - "8291:8080"
    volumes:
      - ../../keycloak/shop-realm.json:/opt/keycloak/data/import/shop-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app-network

  db-migrate:
    image: flyway/flyway:10.21.0-alpine
    command: -url=jdbc:postgresql://postgres:5432/app -user=app -password=app -locations=filesystem:/migrations migrate
    environment:
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ../../../system/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  external-system-simulators:
    build:
      context: ../../../external-systems/simulators
      dockerfile: Dockerfile
    ports:
      - "9211:9000"
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
